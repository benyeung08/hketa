<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f1419">
  <meta name="description" content="香港巴士到站預報，無廣告、無追蹤">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>HKETA Hybrid</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">HKETA<span class="dot">·</span><small id="brandSub">到站預報</small></div>
    <div class="status" id="status">準備中…</div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="主導覽">
    <button data-tab="home"    class="tab active"><span>⌂</span><em data-i18n="home">主頁</em></button>
    <button data-tab="fav"     class="tab"><span>♥</span><em data-i18n="fav">收藏</em></button>
    <button data-tab="search"  class="tab"><span>⌕</span><em data-i18n="search">搜尋</em></button>
    <button data-tab="settings" class="tab"><span>⚙</span><em data-i18n="settings">設定</em></button>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js" defer></script>
</body>
</html>
