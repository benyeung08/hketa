org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# CI 用 --no-daemon，開 configuration cache 反而可能卡
org.gradle.configuration-cache=false

# ⚠️ AGP 9 起 android.onlyEnableUnitTestForTheTestedBuildType 預設係 true ——
# AGP 淨係為「被測試嗰個 build type」（預設 debug）建立 unit test component，
# 所以 :app:testReleaseUnitTest 唔存在，寫死佢會報 "task not found"。
# 我哋**刻意唔開**呢個 flag（開咗會多建 component、拖慢 configuration），
# CI 改為動態偵測實際有邊個 unit test task 再跑（見 build-apk.yml）。
# 測試邏輯唔受 build type 影響：isMinifyEnabled=false，debug／release bytecode 一致。
# 若日後真係要測 release 變體，先至喺呢度加：
# android.onlyEnableUnitTestForTheTestedBuildType=false
