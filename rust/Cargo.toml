[package]
name = "hketa-store"
version = "1.2.21"
edition = "2021"
description = "HKETA index storage - compact binary format, string interning, fast queries"

[lib]
name = "hketa_store"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.21", default-features = false, optional = true }

[features]
default = []
android = ["jni"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
