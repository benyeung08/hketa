name: Backup Signing Keystore

on:
  workflow_dispatch:
    inputs:
      action:
        description: '操作類型'
        required: true
        default: 'backup'
        type: choice
        options:
          - backup
          - restore

permissions:
  actions: read
  contents: read

jobs:
  backup:
    if: github.event.inputs.action == 'backup'
    runs-on: ubuntu-latest
    steps:
      - name: Download keystore artifact
        uses: actions/download-artifact@v4
        with:
          name: signing-keystore-backup

      - name: Display keystore info
        run: |
          echo "✅ Keystore 備份檔案已下載"
          ls -lh release-key.jks 2>/dev/null || echo "❌ 未找到備份檔案"
          
          if [ -f "release-key.jks" ]; then
            echo ""
            echo "📋 Keystore 資訊："
            keytool -list -v -keystore release-key.jks -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" 2>/dev/null || echo "（需要密碼才能查看詳情）"
          fi

  instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Show instructions
        run: |
          echo "=============================================="
          echo "  簽名金鑰備份/恢復操作說明"
          echo "=============================================="
          echo ""
          echo "📌 備份方式："
          echo "  1. 前往 Actions → Backup Signing Keystore"
          echo "  2. 選擇 'backup' 並執行"
          echo "  3. 下載產生的 Artifact"
          echo ""
          echo "📌 恢復方式（換電腦/重建 repo）："
          echo "  1. 將下載的 keystore 檔案 base64 編碼："
          echo "     base64 -w0 release-key.jks > keystore_b64.txt"
          echo "  2. 在 GitHub Secrets 中設定："
          echo "     - SIGNING_KEYSTORE = keystore_b64.txt 的內容"
          echo "     - SIGNING_STORE_PASSWORD = keystore 密碼"
          echo "     - SIGNING_KEY_ALIAS = hketa"
          echo "     - SIGNING_KEY_PASSWORD = keystore 密碼"
          echo ""
          echo "⚠️ 重要：同一個 keystore 必須始終用於所有版本，"
          echo "   否則用戶將無法直接覆蓋安裝更新！"
          echo "=============================================="
