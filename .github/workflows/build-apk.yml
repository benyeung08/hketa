name: Build HKETA APK

# 觸發：push 到 main、push v* 標籤，或在 Actions 頁面手動 Run workflow
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35 components
        run: |
          set -x
          ls "$ANDROID_HOME" || true
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      # 專案缺少 gradlew 腳本，因此直接安裝 Gradle 8.9 建置（AGP 8.7.3 需求）
      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo chmod +x /opt/gradle-8.9/bin/gradle
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          java -version
          gradle --version | head -12

      - name: Build Debug APK
        id: build_debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/debug-build.log

      - name: Build Release APK
        id: build_release
        run: gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/release-build.log

      - name: Collect APKs
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} apk-out/ \;
          ls -lh apk-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hketa-apk
          path: apk-out/*.apk

      - name: Attach APK to release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 建置失敗時一樣上傳完整 log，方便直接下載睇錯誤（唔使喺 Actions 頁逐段展開）
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/*-build.log
          if-no-files-found: ignore
