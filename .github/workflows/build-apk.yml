name: Build HKETA Hybrid APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hketa-hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Deploy web to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Bundle web assets into APK
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -R web/. android/app/src/main/assets/web/
          # Pages 版才需要 Service Worker；file:// 環境註冊會失敗，保留檔案不影響
          ls -la android/app/src/main/assets/web

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Decode signing keystore
        env:
          B64: ${{ secrets.HKETA_KEYSTORE_B64 }}
        if: env.B64 != ''
        run: echo "$B64" | base64 -d > android/keystore.jks

      - name: Assemble APK
        working-directory: android
        env:
          HKETA_KEYSTORE: ${{ secrets.HKETA_KEYSTORE_B64 != '' && '../keystore.jks' || '' }}
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          HKETA_KEY_PASSWORD: ${{ secrets.HKETA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: hketa-hybrid-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
