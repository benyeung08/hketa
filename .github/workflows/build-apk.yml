name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms dir"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools dir"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version 2>/dev/null || echo "no sdkmanager in cmdline-tools/latest"
          # 嘗試其他路徑
          find $ANDROID_HOME -name "sdkmanager" -type f 2>/dev/null | head -5

      - name: Install Android SDK Platform API 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # 如果找不到 sdkmanager，嘗試其他路徑
          if [ ! -f "$SDKMANAGER" ]; then
            echo "cmdline-tools/latest not found, searching..."
            SDKMANAGER=$(find $ANDROID_HOME -name "sdkmanager" -type f 2>/dev/null | head -1)
            echo "Found sdkmanager at: $SDKMANAGER"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "❌ sdkmanager not found, downloading cmdline-tools..."
            mkdir -p $ANDROID_HOME/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "✅ Using sdkmanager: $SDKMANAGER"

          # 接受 licenses
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1

          # 更新 repository 索引
          $SDKMANAGER --sdk_root=$ANDROID_HOME --update 2>&1 | tail -3 || true

          # 列出可用的 API 37 相關包
          echo "=== 搜尋 API 37 相關包 ==="
          $SDKMANAGER --sdk_root=$ANDROID_HOME --list 2>/dev/null | grep -i "android-37\|37.0.0" | head -20

          # 安裝 platform-tools（一定存在）
          echo "📦 安裝 platform-tools..."
          $SDKMANAGER --sdk_root=$ANDROID_HOME "platform-tools" || true

          # 嘗試安裝 API 37 platform
          echo "📦 嘗試安裝 platforms;android-37..."
          if $SDKMANAGER --sdk_root=$ANDROID_HOME "platforms;android-37" 2>&1; then
            echo "✅ platforms;android-37 安裝成功"
            PLATFORM_VER="37"
          else
            echo "⚠️ platforms;android-37 不可用，嘗試其他版本..."
            # 嘗試列出所有可用 platforms
            AVAILABLE=$($SDKMANAGER --sdk_root=$ANDROID_HOME --list 2>/dev/null | grep -oP 'platforms;android-\K[0-9]+' | sort -n | tail -5)
            echo "可用的 platforms: $AVAILABLE"
            # 使用最高的可用版本
            PLATFORM_VER=$(echo "$AVAILABLE" | tail -1)
            echo "選擇 platforms;android-$PLATFORM_VER"
            $SDKMANAGER --sdk_root=$ANDROID_HOME "platforms;android-$PLATFORM_VER" || true
          fi

          # 安裝對應的 build-tools
          echo "📦 嘗試安裝 build-tools;37.0.0..."
          if $SDKMANAGER --sdk_root=$ANDROID_HOME "build-tools;37.0.0" 2>&1; then
            echo "✅ build-tools;37.0.0 安裝成功"
            BT_VER="37.0.0"
          else
            echo "⚠️ build-tools;37.0.0 不可用，嘗試其他版本..."
            AVAILABLE_BT=$($SDKMANAGER --sdk_root=$ANDROID_HOME --list 2>/dev/null | grep -oP 'build-tools;\K[0-9.]+' | sort -V | tail -5)
            echo "可用的 build-tools: $AVAILABLE_BT"
            BT_VER=$(echo "$AVAILABLE_BT" | tail -1)
            echo "選擇 build-tools;$BT_VER"
            $SDKMANAGER --sdk_root=$ANDROID_HOME "build-tools;$BT_VER" || true
          fi

          echo "PLATFORM_VER=$PLATFORM_VER" >> $GITHUB_ENV
          echo "BT_VER=$BT_VER" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          echo "=== 最終 SDK 狀態 ==="
          echo "Platform API: $PLATFORM_VER"
          echo "Build Tools: $BT_VER"
          ls $ANDROID_HOME/platforms/
          ls $ANDROID_HOME/build-tools/

      - name: Update compileSdk in build.gradle.kts
        run: |
          PLATFORM_VER="${{ env.PLATFORM_VER || '37' }}"
          echo "🔧 設定 compileSdk = $PLATFORM_VER"
          # 動態修改 compileSdk 為實際安裝的版本
          sed -i "s/compileSdk = 37/compileSdk = $PLATFORM_VER/" androidApp/build.gradle.kts
          sed -i "s/targetSdk = 37/targetSdk = $PLATFORM_VER/" androidApp/build.gradle.kts
          grep "compileSdk\|targetSdk" androidApp/build.gradle.kts

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > androidApp/local.properties
          cat androidApp/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        working-directory: androidApp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify APK
        run: |
          if [ -f "androidApp/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK 建置成功"
            ls -lh androidApp/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK 未找到"
            echo "=== 嘗試查找所有 APK ==="
            find androidApp -name "*.apk" -type f 2>/dev/null
            echo "=== build 目錄內容 ==="
            ls -la androidApp/app/build/ 2>/dev/null || echo "no build dir"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hketa-app-debug
          path: androidApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HK ETA v${{ github.run_number }}
          files: androidApp/app/build/outputs/apk/debug/app-debug.apk
          body: |
            HK ETA App 自動建置版本
            - 建置編號: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - 平台 API: ${{ env.PLATFORM_VER }}
            - 建置時間: ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
