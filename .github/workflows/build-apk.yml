name: Build HKATE Release APK

# 只出正式版（release）APK —— 一份，簽名固定。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: '把 APK 提交到 builds 目錄'
        type: boolean
        default: true
      target_repo:
        description: '目標 repo（預設＝本 repo；跨 repo 先需要 PUBLISH_TOKEN）'
        type: string
        default: ''
      target_branch:
        description: '目標分支'
        type: string
        default: 'apk'
      target_dir:
        description: '目標目錄（repo 內）'
        type: string
        default: 'builds'
      keep_history:
        description: '保留舊 APK（關＝只保留 latest.apk + 本次版本檔）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ---- 先驗 workflow 本身 ----
  #
  # `uses:` 解析唔到係 **job 層面**嘅錯：GitHub 喺 job 開始之前就要搵到個 action，
  # 搵唔到就成個 job 直接紅，**一個 step 都未跑到**。所以 `continue-on-error`、
  # preflight step 全部救唔到 —— 只能靠喺**另一個 job** 事先驗。
  #
  # 最常踩嘅坑：`taiki-e/install-action@cargo-ndk`
  #   `@` 後面係 git ref（版本），唔係工具名；工具名要用 `with: tool:`
  # 呢度會逐條 `uses:` 驗 ref 係咪「版本樣」（v1 / v1.2.3 / 40 位 SHA / master|main|stable），
  # 唔係就指名道姓報出嚟。
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Validate uses: refs"
        run: |
          set -u
          python3 - <<'PY' || exit 1
          import glob, re, sys

          # 合法嘅 ref：v1 / v1.2 / v1.2.3 / 40 位 SHA / 常見分支名
          OK = re.compile(r'^(v\d+(\.\d+)*|[0-9a-f]{40}|master|main|stable|latest)$')

          bad = []
          for p in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')):
              for i, line in enumerate(open(p, encoding='utf-8').read().split('\n'), 1):
                  m = re.search(r'^\s*-?\s*uses:\s*(\S+)\s*$', line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref.startswith('./') or ref.startswith('docker://'):
                      continue
                  if '@' not in ref:
                      bad.append(f"{p}:{i} `{ref}` 冇 @版本（會用 default branch，唔穩定）")
                      continue
                  name, ver = ref.rsplit('@', 1)
                  if not OK.match(ver):
                      bad.append(
                          f"{p}:{i} `{ref}` —— `@` 後面要係版本（v1 / v1.2.3 / 40 位 SHA），"
                          f"「{ver}」唔係。\n"
                          f"        係咪想寫 `{name}@v2` 再配 `with: tool: {ver}`？"
                      )

          if bad:
              print("::error::workflow 有解析唔到嘅 action —— 會令成個 job 未開始就紅")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("workflow `uses:` 檢查：全部通過 ✔")
          PY

  # ⚠️ 唔好用 `needs: workflow-lint`！
  #
  # 之前寫咗 `needs: workflow-lint`，結果只要 lint job 紅（例如 repo 入面**另一份**
  # 舊 workflow 有 `taiki-e/install-action@cargo-ndk` 呢類壞 ref），build job 會被
  # **直接 skip** —— 日誌淨係得一行
  #     Error: Process completed with exit code 1.
  # 完全睇唔到發生咩事。
  #
  # 而家改為平行跑：lint 紅唔紅都唔阻 build。反正 `uses:` 真係壞嘅話，
  # build job 自己都會喺開始前失敗並報清楚係邊個 action。
  build:
    runs-on: ubuntu-latest

    # job outputs 只係「名稱: 值」嘅純對應，唔支援 description / value 巢狀寫法
    # （寫咗會報 "A mapping was not expected"）
    outputs:
      version_name: ${{ steps.ver.outputs.value }}

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versionName
        id: ver
        run: |
          v=$(grep -m1 'versionName' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "value=${v:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "versionName = ${v:-1.0.0}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---- Rust 內核 ----
      #
      # 一個 .so 擁有四件事：索引儲存＋常駐記憶體、計數、TTL 快取、持久化 KV。
      #
      # 保證出到 .so，按優先次序三條路：
      #   1. repo 已提交預編譯 .so（app/src/main/jniLibs/**）→ 直接用，零 toolchain
      #   2. CI 快取還原上次嘅 .so
      #   3. 現場 cargo ndk 編譯
      #
      # 三條路都失敗先行純 Kotlin 回退（App 側一定有回退，功能一樣），
      # 但**必定印完整 log + ::error::**，唔會靜默默吞咗。
      #
      # 舊版寫 `set -u` 而冇 `-e`：cargo 失敗返 101，但腳本繼續行落去，
      # 尾嗰句 `find` 返 0 就**蓋咗個失敗** —— 所以你只會見到一句 warning，
      # 永遠唔知點解失敗。呢個正係「Rust 索引層係可選」呢條限制一直
      # 解決唔到嘅真正原因：失敗從來冇被報出嚟。
      - name: Restore cached .so
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: hketa-so-${{ hashFiles('rust/src/*.rs', 'rust/Cargo.toml') }}
          restore-keys: |
            hketa-so-

      - name: Install Rust toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      # ⚠️ 唔好再喺度用第三方 action！
      #
      # 之前寫咗 `uses: taiki-e/install-action@cargo-ndk`，但 `@` 後面係 **git ref
      # （版本）**，唔係工具名 —— 所以 GitHub 會去搵一個叫 `cargo-ndk` 嘅 tag，
      # 搵唔到就成個 job 喺**開始之前**直接失敗：
      #     Error: Unable to resolve action `taiki-e/install-action@cargo-ndk`,
      #            unable to find version `cargo-ndk`
      # 呢類錯係 job 層面，所以 `continue-on-error` 同任何 step 都救唔到 ——
      # 一個 step 都未跑到就已經紅咗。
      #
      # 正確寫法係 `uses: taiki-e/install-action@v2` + `with: tool: cargo-ndk`，
      # 但為咗唔再依賴第三方 action（佢改名／刪 tag 會即刻令 build 紅），
      # 而家改為**自己裝**：有預編譯就用，冇就 `cargo install`，永遠唔會 fail 個 job。
      - name: Install cargo-ndk
        continue-on-error: true
        run: |
          set -u
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "✔ cargo-ndk 已經喺度：$(command -v cargo-ndk)"
            cargo-ndk --version || true
            exit 0
          fi
          echo "cargo-ndk 唔喺度，嘗試安裝…"
          if command -v cargo >/dev/null 2>&1; then
            cargo install cargo-ndk --locked 2>&1 | tail -5 || \
              cargo install cargo-ndk 2>&1 | tail -5 || true
          else
            echo "::warning::冇 cargo，裝唔到 cargo-ndk；下面 Build Rust kernel 會自己處理"
          fi
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "✔ 裝好：$(command -v cargo-ndk)"
          else
            echo "::warning::裝唔到 cargo-ndk —— Rust 內核呢次會行純 Kotlin 回退，APK 照出"
          fi

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # ---- 逐個核對 Rust 源碼有冇上傳 ----
      #
      # 呢個係「Rust 內核永遠 build 唔到」嘅**頭號原因**：`lib.rs` 寫咗
      # `pub mod index;` 但 `rust/src/index.rs` 根本冇上傳 → cargo 第一句就
      # `error: file not found for module` → exit 101 → 冇 .so → 行純 Kotlin。
      #
      # 因為手動上傳成日漏檔，而家由 `lib.rs` 入面嘅 `pub mod` 反推出
      # 應該有邊啲 .rs，逐個驗，缺邊個就**指名道姓**話你知。
      - name: Verify Rust kernel sources
        id: verify_rust
        continue-on-error: true
        run: |
          set -uo pipefail
          fail=0
          need() {
            if [ ! -f "$1" ]; then
              echo "::error::缺少 Rust 源碼 $1 —— 唔 upload 呢個檔，cargo 一定失敗"
              fail=1
            else
              echo "  ok  $1  ($(wc -c < "$1") bytes)"
            fi
          }

          echo "--- rust/ 基本檔 ---"
          need rust/Cargo.toml
          need rust/src/lib.rs
          need rust/src/jni.rs

          echo "--- 由 lib.rs 嘅 pub mod 反推應該有邊啲 .rs ---"
          if [ -f rust/src/lib.rs ]; then
            mods=$(grep -oE '^[[:space:]]*pub[[:space:]]+mod[[:space:]]+[a-z_]+;' rust/src/lib.rs \
                   | grep -oE '[a-z_]+;' | tr -d ';' | sort -u)
            for m in $mods; do
              if [ -f "rust/src/$m.rs" ]; then
                echo "  ok  rust/src/$m.rs  ($(wc -c < "rust/src/$m.rs") bytes)"
              elif [ -f "rust/src/$m/mod.rs" ]; then
                echo "  ok  rust/src/$m/mod.rs"
              else
                echo "::error::lib.rs 宣告咗 \`pub mod $m;\`，但搵唔到 rust/src/$m.rs —— 要 upload 佢"
                fail=1
              fi
            done
          fi

          echo "--- Kotlin 側殘留舊檔 ---"
          if [ -f app/src/main/java/com/hketa/app/data/RustIndex.kt ]; then
            echo "::warning::RustIndex.kt 仲喺度（已被 RustKernel.kt 取代，建議 git rm）"
          fi

          echo "--- rust/src/ 實際有嘅檔 ---"
          ls -1 rust/src/ 2>/dev/null || echo "（rust/src 唔存在！）"

          if [ "$fail" != "0" ]; then
            echo "::error::Rust 源碼唔齊 —— cargo 會失敗，APK 會行純 Kotlin 回退"
          else
            echo "Rust 源碼齊晒 ✔"
          fi

      - name: Build Rust kernel
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          SO=app/src/main/jniLibs
          mkdir -p "$SO"

          echo "--- 1) repo 有冇預編譯 .so？---"
          if ls "$SO"/*/libhketa_store.so >/dev/null 2>&1; then
            echo "✔ repo 已有預編譯 .so —— 直接用，唔使 Rust toolchain"
            ls -la "$SO"/*/libhketa_store.so
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=build" >> "$GITHUB_OUTPUT"

          echo "--- 2) 搵／裝 NDK ---"
          # Android 17（API 37）／16 KB page size 要求 NDK r27 或以上：
          #   * r27 起 lld 先完整支援 -z max-page-size=16384
          #   * r26 砌到，但對 16 KB ELF 對齊嘅處理未完整
          # 所以優先 27.2，裝唔到先退回 26.1（照出，但可能冇 16 KB 對齊）。
          WANT_NDK="27.2.12479018"
          FALLBACK_NDK="26.1.10909125"
          if [ ! -d "${ANDROID_HOME}/ndk" ] || [ -z "$(ls -A "${ANDROID_HOME}/ndk" 2>/dev/null)" ]; then
            CM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$CM" ] || CM=$(command -v sdkmanager || true)
            if [ -n "$CM" ]; then
              yes | "$CM" --install "ndk;$WANT_NDK" || \
                yes | "$CM" --install "ndk;$FALLBACK_NDK" || \
                yes | "$CM" --install "ndk-bundle" || true
            fi
          fi
          ls -1 "${ANDROID_HOME}/ndk" 2>/dev/null || echo "（搵唔到 NDK）"

          echo "--- 3) cargo-ndk 喺唔喺度？---"
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            echo "冇預編譯版，由 source 砌（慢，最後手段）"
            cargo install cargo-ndk --locked || cargo install cargo-ndk
          fi

          echo "--- 4) cargo ndk build ---"
          cd rust
          cargo ndk \
            -t armeabi-v7a \
            -t arm64-v8a \
            -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release --features android 2>&1 | tee /tmp/cargo-build.log
          cd ..
          echo "--- 產出 ---"
          ls -la "$SO"/*/libhketa_store.so

      # ── 16 KB page size 對齊檢查 ──────────────────────────────
      # Android 15+ 支援 16 KB page，Android 17 設備普遍採用；Play 自
      # 2025-11-01 起要求含 native code 嘅 App 必須支援。
      # .so 嘅 LOAD 段若仍係 4 KB 對齊，喺 16 KB 裝置上 dlopen 會失敗
      # → System.loadLibrary 抛 UnsatisfiedLinkError → 內核靜默回退。
      # 呢類失敗喺 CI 完全睇唔出（編譯成功、打包成功），只會喺用戶機上
      # 「時靈時唔靈」，所以一定要喺呢度驗。
      - name: Verify 16KB page alignment
        id: verify_16kb
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          SO=app/src/main/jniLibs
          READELF=""
          for c in llvm-readelf readelf "${ANDROID_HOME}/ndk/"*/toolchains/llvm/prebuilt/*/bin/llvm-readelf; do
            command -v "$c" >/dev/null 2>&1 && READELF="$c" && break
            [ -x "$c" ] && READELF="$c" && break
          done
          if [ -z "$READELF" ]; then
            echo "::warning::搵唔到 readelf —— 冇得驗 16 KB 對齊（唔代表有問題）"
            exit 0
          fi
          echo "用 $READELF"
          bad=0
          for f in $(find "$SO" -name 'libhketa_store.so' 2>/dev/null | sort); do
            # 抽出所有 LOAD 段嘅 Align 欄
            aligns=$("$READELF" -l "$f" 2>/dev/null | awk '/LOAD/{for(i=1;i<=NF;i++) if($i ~ /^0x[0-9a-f]+$/ && $(i-1)=="Align") print $i}' | sort -u | tr '\n' ' ')
            echo "  $(dirname "$f" | xargs basename): Align = ${aligns:-（讀唔到）}"
            # 0x1000 = 4096（4 KB，唔合格）；0x4000+ = 16384（16 KB，合格）
            if echo "$aligns" | grep -q "0x1000"; then
              echo "    ::warning::呢個 .so 仍然係 4 KB 對齊 —— 16 KB 裝置會載唔入"
              bad=1
            fi
          done
          if [ "$bad" = "1" ]; then
            echo "::warning::有 .so 未做 16 KB 對齊。確認 rust/.cargo/config.toml 有冇上傳（NDK 要 r27+）"
          else
            echo "16 KB 對齊檢查通過 ✔"
          fi

      - name: Verify .so (never silent)
        id: verify_so
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          SO=app/src/main/jniLibs
          found=$(find "$SO" -name 'libhketa_store.so' 2>/dev/null | sort)
          if [ -n "$found" ]; then
            echo "Rust 內核：已打包 ✔"
            echo "$found" | while read -r f; do echo "  $f ($(stat -c%s "$f") bytes)"; done
          else
            echo "::warning::Rust 內核冇打包到 —— App 會行純 Kotlin 回退（功能一樣，但冇慳到位）"
            echo "cargo 有冇跑到？mode=${{ steps.rust.outputs.mode }}"
            if [ -f /tmp/cargo-build.log ]; then
              echo "===== cargo build log（尾 80 行）====="
              tail -80 /tmp/cargo-build.log
            fi
            echo "===== 想一勞永逸：本地跑 rust/build-android.sh，把 .so commit 入 repo ====="
          fi

      # Android 17 (API 37) 需要 platforms;android-37 + build-tools;36.0.0。
      # runner 預裝嘅 cmdline-tools 通常太舊，**根本唔知有 android-37 呢個包**，
      # 所以要先升 cmdline-tools；升完都冇就**自動降級**到最高可用嘅 platform，
      # 等 build 照出到 APK（黃色警告），好過直接紅。
      # 預檢：喺開 build 之前逐項核對，缺乜講乜。
      # 之前幾次 CI 紅，都係「檔案未上傳成功」或「舊檔殘留」造成，
      # 但 Gradle 嘅報錯好難直接對返邊個檔案 —— 呢步會一次過講清楚。
      # ---- Kotlin 字串健全性（compileReleaseKotlin 之前就捉到）----
      #
      # 呢個係**最常令 build 紅**嘅一類錯，而 Gradle 嘅報錯淨係畀
      # `e: Changelog.kt:51:520 Syntax error: Expecting '"'` 呢句 ——
      # 唔講邊個字串、唔講點解，好難對返去改。
      #
      # 三種我實際踩過嘅坑：
      #   1. 字串冇收尾引號（寫長文案時漏咗最尾嗰個 `"`）
      #   2. 字串入面有未轉義嘅 `"`（例如英文寫 `"now"`、`"Storage: …"`）
      #   3. 兩個逗號 `,,`（腳本批次產生時留下）
      #
      # 而家逐行驗：未轉義嘅引號數要係**雙數**（已排除 `"""` 同 char literal `'"'`），
      # 有問題就**指名邊個檔案第幾行第幾列**。
      - name: Preflight - Kotlin string sanity
        id: pf_strings
        continue-on-error: true   # 診斷性質：就算有發現都唔好阻住出 APK
        run: |
          set -u
          python3 - <<'PY' || exit 1
          import glob, sys

          def scan(path):
              bad = []
              code = open(path, encoding='utf-8').read()
              for i, l in enumerate(code.split('\n'), 1):
                  # raw string 分隔行（""" 開始或結束）→ 跳過引號計數
                  if l.count('"""') % 2 == 1:
                      continue
                  pos = []
                  j = 0
                  while j < len(l):
                      c = l[j]
                      if c == '\\':
                          j += 2; continue
                      # char literal：嚴格匹配 'X' 或 '\X'
                      if c == "'" and j + 2 < len(l) and (
                              l[j+2] == "'" or (l[j+1] == '\\' and j + 3 < len(l) and l[j+3] == "'")):
                          j += 3 if l[j+1] != '\\' else 4
                          continue
                      if c == '"':
                          pos.append(j + 1); j += 1; continue
                      j += 1
                  if len(pos) % 2 != 0:
                      bad.append(f"{path}:{i}:{pos[-1] if pos else 0} 字串冇收尾引號（未轉義引號 {len(pos)} 個 @ {pos[:8]}）")
                      continue
                  if len(pos) > 2 and len(l) > 200:
                      bad.append(f"{path}:{i}:{pos[1]} 長字串入面疑似有未轉義嘅雙引號（{len(pos)} 個 @ {pos[:8]}）—— 要寫成 \\\"")
                  if ',,' in l:
                      bad.append(f"{path}:{i}:{l.index(',,')+1} 有兩個連續逗號")
              return bad

          allb = []
          files = sorted(glob.glob('app/src/main/java/**/*.kt', recursive=True))
          for p in files:
              allb += scan(p)
          if allb:
              print("FAIL", len(allb))
              for b in allb[:40]:
                  print("  ", b)
              sys.exit(1)
          print("Kotlin 字串健全性：全部通過 ✔（掃咗 %d 個檔）" % len(files))

          PY

      # ---- 塊註釋配對（Kotlin 塊註釋**可以嵌套**，一定要計深度）----
      #
      # 呢個係一個超級隱蔽嘅坑：注释**文字入面**有 `/*` 就會開一層嵌套，
      # 從此成個檔案都被吞落註釋入面。真實案例（RustStore.kt）：
      #
      #     * | Leaflet 資源包 | `filesDir/hketa_assets/*.css｜js` |
      #                                                 ^^ `/*.css` 入面嘅 `/*`
      #
      # 結果：`RustStore.kt:166:1 Syntax error: Unclosed comment`
      #       → 成個 object 唔存在 → 引用佢嘅檔案全部
      #         `Unresolved reference 'RustStore'`（一堆連鎖錯誤，好難睇出源頭）
      - name: Preflight - Kotlin block comments balance
        id: pf_comments
        continue-on-error: true
        run: |
          set -u
          python3 - <<'PY' || exit 1
          import glob, sys

          def scan(path):
              s = open(path, encoding='utf-8').read()
              n = len(s); i = 0; depth = 0; stack = []
              errs = []; line = 1; col = 1
              def adv(k):
                  nonlocal i, line, col
                  for _ in range(k):
                      if s[i] == '\n': line += 1; col = 1
                      else: col += 1
                      i += 1
              while i < n:
                  c = s[i]
                  if c == '"':                       # 字串（含 """ 同跳脫）
                      if s.startswith('"""', i):
                          j = s.find('"""', i + 3); j = n if j < 0 else j + 3
                      else:
                          j = i + 1
                          while j < n:
                              if s[j] == '\\': j += 2; continue
                              if s[j] == '"': j += 1; break
                              j += 1
                      adv(j - i); continue
                  if s.startswith('//', i):          # 行註釋
                      j = s.find('\n', i); j = n if j < 0 else j
                      adv(j - i); continue
                  if s.startswith('/*', i):          # 塊註釋（**可嵌套**）
                      stack.append((line, col)); depth += 1; adv(2); continue
                  if s.startswith('*/', i):
                      if depth == 0:
                          errs.append(f"{path}:{line}:{col} 多出嚟嘅 `*/`")
                      else:
                          depth -= 1; stack.pop()
                      adv(2); continue
                  adv(1)
              for (l, cc) in stack:
                  errs.append(
                      f"{path}:{l}:{cc} 塊註釋冇關閉（或者入面有多餘嘅 `/*`，"
                      f"例如寫咗 `assets/*.css` 呢類路徑）"
                  )
              return errs

          files = sorted(glob.glob('app/src/main/java/**/*.kt', recursive=True))
          allb = []
          for p in files:
              allb += scan(p)
          if allb:
              print("::warning::Kotlin 塊註釋唔平衡 —— 會搞到成個檔案被吞落註釋入面")
              for b in allb[:40]:
                  print("  " + b)
              sys.exit(1)
          print("Kotlin 塊註釋配對：全部通過 ✔（掃咗 %d 個檔）" % len(files))

          PY

      - name: Preflight - verify required files
        id: pf_files
        continue-on-error: true
        run: |
          set -u
          fail=0
          need() {
            if [ ! -f "$1" ]; then
              echo "::warning::缺少檔案 $1"
              fail=1
            else
              echo "  ok  $1"
            fi
          }
          absent() {
            if [ -f "$1" ]; then
              echo "::warning::殘留舊檔（應該刪） $1"
              fail=1
            else
              echo "  ok  無殘留 $1"
            fi
          }

          echo "--- 必需嘅源碼 ---"
          need app/build.gradle.kts
          need build.gradle.kts
          need settings.gradle.kts
          need app/src/main/AndroidManifest.xml
          need app/src/main/java/com/hketa/app/data/Changelog.kt
          need app/src/main/java/com/hketa/app/ui/screens/AboutScreen.kt

          echo "--- widget 資源（AndroidManifest 會引用）---"
          need app/src/main/res/xml/hketa_widget_info.xml
          need app/src/main/res/layout/widget_hketa.xml
          need app/src/main/res/layout/widget_row.xml
          need app/src/main/res/drawable/widget_bg.xml
          need app/src/main/res/drawable/ic_settings.xml

          echo "--- 唔應該存在嘅舊檔 ---"
          absent app/src/main/java/com/hketa/app/vm/Changelog.kt
          for f in EtaScreen FavoritesScreen HomeScreen SearchScreen SettingsScreen \
                   RailScreen NearbyScreen RouteStopsScreen AboutScreen; do
            absent "app/src/main/java/com/hketa/app/data/$f.kt"
            absent "app/src/main/java/com/hketa/app/vm/$f.kt"
          done

          # ---- 資源引用完整性：捉「res 檔冇上傳」呢類 AAPT 錯 ----
          # 之前出現過「style/Theme.HKATE not found」—— 因為 themes.xml 冇上傳，
          # 但 AAPT 淨係講資源名，唔講缺邊個檔。呢度直接掃全部 XML 嘅
          # @style / @drawable / @string / @xml … 引用，res 入面冇就報。
          echo "--- res 引用嘅資源係咪存在 ---"
          RES=app/src/main/res
          resfiles=$(find app/src/main/AndroidManifest.xml "$RES" -name "*.xml" -type f 2>/dev/null)
          echo "  （掃 $(printf '%s\n' "$resfiles" | grep -c .) 個 XML）"
          refs=$(grep -ohE '@(style|drawable|xml|string|mipmap|color|dimen|layout)/[A-Za-z_][A-Za-z0-9_.]*' \
                  $resfiles 2>/dev/null | sort -u)
          refs=$(printf '%s\n' "$refs" | grep -v '^@android' || true)
          for ref in $refs; do
            rtyp=${ref#@}; rtyp=${rtyp%%/*}; rname=${ref#*/}
            [ -z "$rname" ] && continue
            found=""
            case "$rtyp" in
              style|string|color|dimen)
                found=$(grep -rlE "<(string|style|color|dimen)[^>]*name=\"$rname\"" \
                        "$RES"/values* 2>/dev/null | head -1) ;;
              *)
                for rd in $(find "$RES" -maxdepth 1 -type d -name "$rtyp*" 2>/dev/null); do
                  for rext in .xml .png .webp .jpg .jpeg ""; do
                    if [ -f "$rd/$rname$rext" ]; then found="$rd/$rname$rext"; break 2; fi
                  done
                done ;;
            esac
            if [ -n "$found" ]; then
              echo "  ok  $ref"
            else
              echo "::warning::引用咗 $ref，但 res 入面搵唔到 —— 對應資源檔可能未上傳"
              fail=1
            fi
          done
          echo "  （檢查咗 $(printf '%s\n' "$refs" | grep -c .) 個資源引用）"
          # themes.xml 係最常漏傳嘅（Manifest 引用 android:theme）
          need "$RES/values/themes.xml"

          echo "--- 有冇同名 .kt（會 Redeclaration）---"
          dup=$(find app/src/main/java -name "*.kt" -printf "%f\n" | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::warning::有同名 .kt 檔：$dup"
            fail=1
          else
            echo "  ok  無同名 .kt"
          fi

          echo "--- 三語 strings 係咪對齊 ---"
          for d in values values-zh-rCN values-en; do
            n=$(grep -c '<string name=' "app/src/main/res/$d/strings.xml" || echo 0)
            echo "  $d: $n"
          done

          # ---- 通用引用完整性：捉「新檔案未上傳」呢類錯 ----
          # 之前成日出現「某個 .kt 冇傳上去 → unresolved reference」，
          # 但報錯淨係講符號名，唔講缺邊個檔。呢度直接掃全部
          # com.hketa.app.* 嘅引用，冇定義就報。
          echo "--- 引用完整性：import 嘅 com.hketa.app 符號有冇定義 ---"
          SRC=app/src/main/java/com/hketa/app
          defs=$(grep -rhoE '^\s*(@[A-Za-z0-9_.]+\s*)*\s*(public |internal |private |data |sealed |enum |abstract |final |value |const )*(class|object|interface|fun|val) [A-Za-z_][A-Za-z0-9_]*' \
                  "$SRC" --include="*.kt" 2>/dev/null \
                | sed -E 's/.*(class|object|interface|fun|val) //' | sort -u)
          syms=$(grep -rhoE '(import )?com\.hketa\.app\.[A-Za-z0-9_.]+' \
                  "$SRC" --include="*.kt" 2>/dev/null \
                | sed -E 's/^import //; s/.*\.//' | sort -u)
          checked=0
          for sname in $syms; do
            # 淨係理「首字母大寫但唔係全大寫」＝ class / object / Composable fun
            printf '%s' "$sname" | grep -qE '^[A-Z][A-Za-z0-9_]*[a-z][A-Za-z0-9_]*$' || continue
            checked=$((checked+1))
            if printf '%s\n' "$defs" | grep -qx "$sname"; then
              echo "  ok  $sname"
            else
              echo "::warning::引用咗冇定義嘅符號 $sname —— 對應 .kt 檔案可能未上傳"
              fail=1
            fi
          done
          echo "  （檢查咗 $checked 個符號）"

          # ---- AndroidManifest 引用嘅 class 係咪存在 ----
          echo "--- AndroidManifest 引用嘅 class 係咪存在 ---"
          PKG=com/hketa/app
          for n in $(grep -oE 'android:name="[^"]+"' app/src/main/AndroidManifest.xml \
                     | sed -E 's/android:name="//; s/"$//'); do
            case "$n" in
              .*)                 rel="$PKG/${n#.}" ;;
              com.hketa.app.*)    rel="$PKG/$(printf '%s' "${n#com.hketa.app.}" | tr '.' '/')" ;;
              android.*|androidx.*) continue ;;
              *) continue ;;
            esac
            mf="app/src/main/java/$rel.kt"
            if [ -f "$mf" ]; then
              echo "  ok  $n"
            else
              echo "::warning::AndroidManifest 引用咗 $n，但搵唔到 $mf（檔案可能未上傳）"
              fail=1
            fi
          done

          # ---- 四份 strings key 係咪一致 ----
          echo "--- 四份 strings key 係咪一致 ---"
          bkeys=$(grep -oE '<string name="[^"]+"' app/src/main/res/values/strings.xml \
                  | sed -E 's/<string name="//; s/"$//' | sort -u)
          echo "  values: $(printf '%s\n' "$bkeys" | wc -l)"
          for d in values-zh-rCN values-en values-b+zh+Hans; do
            kf="app/src/main/res/$d/strings.xml"
            if [ ! -f "$kf" ]; then
              echo "::warning::缺少 $kf"; fail=1; continue
            fi
            kk=$(grep -oE '<string name="[^"]+"' "$kf" | sed -E 's/<string name="//; s/"$//' | sort -u)
            echo "  $d: $(printf '%s\n' "$kk" | wc -l)"
            miss=$(comm -23 <(printf '%s\n' "$bkeys") <(printf '%s\n' "$kk"))
            if [ -n "$miss" ]; then
              echo "::warning::$d 缺咗 $(printf '%s\n' "$miss" | wc -l) 個 key：$(printf '%s' "$miss" | head -5 | tr '\n' ' ')"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::warning::預檢有發現 —— 上面列出嘅嘢最好執一執（但唔會阻住出 APK）"
            exit 1
          fi
          echo "預檢全部通過 ✔"

      # 預檢三項全部係「診斷性質」：有發現會變黃色警告，但**唔會再阻住出 APK**。
      #
      # 之前佢哋係硬 gate（`exit 1` 又冇 continue-on-error）—— 任何一項有發現
      # （例如三語 strings 未對齊、某個 drawable 未上傳、長字串有引號）
      # 都會令 job 喺 Gradle 都未跑到就紅咗，淨係得一句
      #     Error: Process completed with exit code 1.
      # 完全睇唔到係邊一步。而家一律變警告，Gradle 照跑；真係缺檔嘅話
      # Gradle 自己會報得更準（講明邊個檔案邊一行）。
      # 呢個係真實踩過嘅坑：`AppViewModel.kt` 喺 `com.hketa.app.vm`，
      # 用到 `com.hketa.app.data.RustKernel`，但漏咗 import ——
      # Kotlin **唔會**自動 import 第個 package，會報
      #   e: Unresolved reference 'RustKernel'
      # 仲會連帶爆一堆假錯誤（Flow<uninferred ERROR CLASS>、stop / distM unresolved），
      # 睇落好似好多嘢壞咗，其實淨係差一行 import。
      - name: Preflight - cross-package imports
        id: preflight_imports
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re, glob, sys, collections
          ROOT = "app/src/main/java/com/hketa/app"
          # 1) 收集 com.hketa.app.data 入面所有 top-level 宣告名
          decl = collections.defaultdict(set)
          for p in glob.glob(ROOT + "/data/*.kt"):
              s = open(p, encoding="utf-8").read()
              for m in re.finditer(
                  r'^(?:object|class|data class|interface|enum class|fun|val|var|const val)\s+([A-Za-z_]\w*)',
                  s, re.M):
                  decl[m.group(1)].add(p)
          bad = []
          # 2) 逐個檔案：有冇「裸用」呢啲名，但唔喺 data package 又冇 import
          for p in glob.glob(ROOT + "/**/*.kt", recursive=True):
              s = open(p, encoding="utf-8").read()
              m = re.search(r'^package\s+([\w.]+)', s, re.M)
              pkg = m.group(1) if m else ""
              if pkg == "com.hketa.app.data":
                  continue
              imports = set(re.findall(r'^import\s+([\w.]+)\s*$', s, re.M))
              for name in decl:
                  if not re.search(r'(?<![\w.])' + name + r'\s*[.(]', s):
                      continue
                  if ("com.hketa.app.data." + name) in imports:
                      continue
                  bad.append((p, name))
          if bad:
              for p, name in sorted(set(bad)):
                  print("::warning::%s 用到 com.hketa.app.data.%s 但冇 import —— Kotlin 唔會自動 import 第個 package" % (p, name))
              sys.exit(1)
          print("全部通過 ✔（掃咗 %d 個 .kt）" % len(glob.glob(ROOT + "/**/*.kt", recursive=True)))
          PY

      - name: Report which preflight step flagged
        id: pf_summary
        if: always()
        run: |
          echo "### 預檢結果（黃色 = 有發現，唔會阻住出 APK）"
          echo ""
          echo "| 步驟 | 結果 |"
          echo "|---|---|"
          echo "| Rust 源碼齊唔齊 | ${{ steps.verify_rust.outcome }} |"
          echo "| Rust 內核有冇打包 .so | ${{ steps.verify_so.outcome }} |"
          echo "| Kotlin 字串健全性 | ${{ steps.pf_strings.outcome }} |"
          echo "| Kotlin 塊註釋配對 | ${{ steps.pf_comments.outcome }} |"
          echo "| 必需檔案 / 資源引用 | ${{ steps.pf_files.outcome }} |"
          echo "| Rust 編譯 | ${{ steps.rust.outcome }} |"
          echo ""
          echo "> 全部 \`skipped\` = 呢一步冇跑到；\`failure\` = 有發現（黃色，唔使理都可以出 APK）"

      - name: Install Android SDK components
        id: sdk
        env:
          WANT_PLATFORM: "37"
          WANT_BUILD_TOOLS: "36.0.0"
        run: |
          set -x
          ls "$ANDROID_HOME" || true

          # ① 升 cmdline-tools（舊 sdkmanager 認唔到新 platform）
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --install "cmdline-tools;latest" || true
          # 新裝嘅命令行工具自己帶一份 sdkmanager，優先佢
          LATEST_CLT=$(ls -d "$ANDROID_HOME"/cmdline-tools/latest/bin 2>/dev/null | head -1)
          SM=sdkmanager
          if [ -n "$LATEST_CLT" ] && [ -x "$LATEST_CLT/sdkmanager" ]; then
            SM="$LATEST_CLT/sdkmanager"
          fi
          echo "using sdkmanager: $SM"
          echo "SM=$SM" >> "$GITHUB_ENV"

          yes | "$SM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true

          # ② 試裝目標 platform + build-tools
          yes | "$SM" --sdk_root="$ANDROID_HOME" \
            --install "platforms;android-$WANT_PLATFORM" "build-tools;$WANT_BUILD_TOOLS" || true

          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- installed build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true

          # ③ 搵最高可用嘅 platform（已裝嗰啲入面揀）
          highest_available() {
            ls "$ANDROID_HOME/platforms" 2>/dev/null \
              | grep -oE '^android-[0-9]+$' \
              | grep -oE '[0-9]+' | sort -n | tail -1
          }
          PLAT=""
          if [ -d "$ANDROID_HOME/platforms/android-$WANT_PLATFORM" ]; then
            PLAT="$WANT_PLATFORM"
          else
            PLAT=$(highest_available)
            if [ -n "$PLAT" ]; then
              echo "::warning::platforms;android-$WANT_PLATFORM unavailable - falling back to android-$PLAT"
            fi
          fi
          if [ -z "$PLAT" ]; then
            # 連一個 platform 都冇 —— 印出 sdkmanager 見到啲乜，方便診斷
            echo "::error::no Android platform installed, cannot build"
            echo "--- sdkmanager --list (platforms) ---"
            "$SM" --sdk_root="$ANDROID_HOME" --list 2>/dev/null | grep -E 'platforms;android-' | head -20 || true
            exit 1
          fi
          echo "PLATFORM=$PLAT" >> "$GITHUB_ENV"
          echo "使用 platform: android-$PLAT"

          # ④ build-tools：AGP 9.1.1 預設要 36.0.0；冇就降到最高可用嗰份
          BT=""
          if [ -d "$ANDROID_HOME/build-tools/$WANT_BUILD_TOOLS" ]; then
            BT="$WANT_BUILD_TOOLS"
          else
            # 試埋幾個常見版本
            for cand in "36.0.0" "35.0.1" "35.0.0" "34.0.0"; do
              yes | "$SM" --sdk_root="$ANDROID_HOME" --install "build-tools;$cand" > /dev/null 2>&1 || true
              if [ -d "$ANDROID_HOME/build-tools/$cand" ]; then BT="$cand"; break; fi
            done
            if [ -z "$BT" ]; then
              BT=$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | sort -V | tail -1)
            fi
            [ -n "$BT" ] && echo "::warning::build-tools;$WANT_BUILD_TOOLS unavailable - using $BT"
          fi
          if [ -z "$BT" ]; then
            echo "::error::no build-tools available, cannot build"
            exit 1
          fi
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "使用 build-tools: $BT"

      # 如果裝唔到 android-37，就自動把 compileSdk / targetSdk 降到最高可用嗰個，
      # 等 APK 照出得到（降級會寫明喺摘要度）。
      - name: Align SDK versions with what is installed
        run: |
          set -e
          PLAT="${PLATFORM:-37}"
          cur_compile=$(grep -m1 '^[[:space:]]*compileSdk' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          cur_target=$(grep -m1 '^[[:space:]]*targetSdk' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          echo "build.gradle.kts: compileSdk=$cur_compile targetSdk=$cur_target ; runner platform=$PLAT"
          if [ "$PLAT" != "$cur_compile" ]; then
            echo "::warning::降級 compileSdk $cur_compile -> $PLAT（runner 冇 android-$cur_compile）"
            sed -i "s/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*[0-9]*/    compileSdk = $PLAT/" app/build.gradle.kts
          fi
          if [ "$cur_target" -gt "$PLAT" ]; then
            echo "::warning::降級 targetSdk $cur_target -> $PLAT"
            sed -i "s/^[[:space:]]*targetSdk[[:space:]]*=[[:space:]]*[0-9]*/        targetSdk = $PLAT/" app/build.gradle.kts
          fi
          # build-tools：AGP 會自動揀，但如果降咗級就明確指定，免得佢搵唔到又想上網下載
          BT="${BUILD_TOOLS:-36.0.0}"
          cur_bt=$(grep -m1 'buildToolsVersion' app/build.gradle.kts | grep -oE '[0-9]+(\.[0-9]+)*' | head -1)
          if [ "$BT" != "36.0.0" ]; then
            if [ -n "$cur_bt" ]; then
              sed -i "s/buildToolsVersion[[:space:]]*=[[:space:]]*\"[0-9.]*\"/buildToolsVersion = \"$BT\"/" app/build.gradle.kts
            else
              sed -i "s/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*[0-9]*/    compileSdk = $PLAT\n    buildToolsVersion = \"$BT\"/" app/build.gradle.kts
            fi
            echo "::warning::指定 buildToolsVersion = $BT"
          fi
          echo "--- final ---"
          grep -nE 'compileSdk|buildToolsVersion|minSdk|targetSdk' app/build.gradle.kts

      # AGP 9.1.1（compileSdk 37 嘅硬門檻）要求最低 Gradle 9.3.1。
      # runner 預裝嘅 Gradle 可能係 8.9 —— 淨係靠 PATH 唔穩陣，所以：
      #   ① 裝落 /opt/gradle-9.3.1
      #   ② 用**絕對路徑**叫 gradle，唔經 PATH
      #   ③ 開 build 前硬驗版本，唔啱即刻紅（唔好等 AGP 報 cryptic 嘅 version-check 錯）
      - name: Install Gradle 9.3.1
        run: |
          set -e
          if [ ! -x /opt/gradle-9.3.1/bin/gradle ]; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
            sudo unzip -q -o /tmp/gradle.zip -d /opt
            sudo chmod +x /opt/gradle-9.3.1/bin/gradle
          fi
          echo "GRADLE_BIN=/opt/gradle-9.3.1/bin/gradle" >> "$GITHUB_ENV"

      - name: Verify Gradle version
        run: |
          set -e
          echo "GRADLE_BIN = ${GRADLE_BIN}"
          java -version
          "$GRADLE_BIN" --version | head -12
          v=$("$GRADLE_BIN" --version | grep -m1 '^Gradle' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          echo "detected gradle = $v"
          major=$(echo "$v" | cut -d. -f1)
          minor=$(echo "$v" | cut -d. -f2)
          if [ "$major" -lt 9 ] || { [ "$major" -eq 9 ] && [ "$minor" -lt 3 ]; }; then
            echo "::error::Gradle $v is too old - AGP 9.1.1 needs >= 9.3.1 (compileSdk 37)"
            exit 1
          fi
          echo "gradle OK (>= 9.3.1)"

      # 固定簽名：GitHub runner 每次都係全新機器，若然用系統自動產生嘅 debug key，
      # 每次簽名都唔同，用戶裝新版會彈「套件與現有的套件發生衝突」。
      # 呢度確保 keystore/hketa.jks 存在（冇就由 base64 文字檔還原）。
      - name: Ensure signing keystore
        run: |
          mkdir -p keystore
          if [ -s keystore/hketa.jks ]; then
            echo "keystore/hketa.jks already present"
          elif [ -s keystore/hketa.jks.b64 ]; then
            base64 -d keystore/hketa.jks.b64 > keystore/hketa.jks
            echo "restored from hketa.jks.b64"
          else
            echo "::warning::no fixed keystore found - APK signature will differ between builds"
          fi
          if [ -s keystore/hketa.jks ]; then
            keytool -list -keystore keystore/hketa.jks -storepass hketa2026 -alias hketa > /dev/null 2>&1 \
              && echo "keystore verified" \
              || { echo "::error::keystore is invalid"; exit 1; }
          fi

      # ─────────────────────────────────────────────────────────────
      # 單元測試 —— 同 compileReleaseKotlin **平級**，紅咗就唔出包。
      #
      # 呢度同其餘 preflight 唔同：上面嗰啲（引號、塊註釋、缺檔）全部係
      # 文字檢查，有機會誤判，所以降咗做 warning；但單測係**真正嘅
      # 正確性測試**，唔可以降級 —— 否則呢個 step 就冇意義。
      #
      # 測嘅係兩樣嘢：
      #   * DataGuard      —— 壞資料唔可以覆蓋好資料（防聚合檔倒退）
      #   * RustKernel     —— Kotlin 回退版嘅 golden values（parity 嘅一半）
      #
      # 呢啲測試**唔使 Robolectric**，所以淨係會下載 JUnit，唔會拖慢 CI。
      - name: Run unit tests
        id: unittest
        run: |
          set -o pipefail
          # 用絕對路徑：唔經 PATH，避免用到 runner 預裝嘅舊 Gradle（8.9）
          "$GRADLE_BIN" :app:testReleaseUnitTest --no-daemon 2>&1 | tee /tmp/unit-test.log

      # 把測試結果寫入 job summary —— 唔使下載 artifact 都睇到「跑咗幾個、錯咗邊個」
      - name: Report unit test results
        if: always()
        run: |
          echo "### 單元測試" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          R="app/build/test-results/testReleaseUnitTest"
          if [ -d "$R" ]; then
            TOTAL=0; FAILED=0
            for f in "$R"/*.xml; do
              [ -f "$f" ] || continue
              # <testsuite name="..." tests="12" skipped="0" failures="0" errors="0">
              T=$(sed -n 's/.*tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
              F=$(sed -n 's/.*failures="\([0-9]*\)".*/\1/p' "$f" | head -1)
              E=$(sed -n 's/.*errors="\([0-9]*\)".*/\1/p' "$f" | head -1)
              TOTAL=$((TOTAL + ${T:-0}))
              FAILED=$((FAILED + ${F:-0} + ${E:-0}))
            done
            echo "- 跑咗 **$TOTAL** 個測試" >> "$GITHUB_STEP_SUMMARY"
            if [ "$FAILED" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "- 全部通過 ✅" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **$FAILED 個失敗** ❌ —— 睇下面 step log" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- ⚠️ 搵唔到測試報告目錄（係咪根本冇跑到？）" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 一定要 set -o pipefail：淨係寫 `gradle ... | tee log` 嘅話，
      # 管道退出碼係 tee（永遠 0），gradle 失敗會被吞掉、步驟顯示綠剔。
      - name: Build Release APK
        id: gradle
        run: |
          set -o pipefail
          # 用絕對路徑：唔經 PATH，避免用到 runner 預裝嘅舊 Gradle（8.9）
          "$GRADLE_BIN" :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/release-build.log

      - name: Show build outputs
        run: |
          echo "--- app/build/outputs ---"
          find app/build/outputs -maxdepth 4 2>/dev/null || echo "(none)"
          echo "--- all apk ---"
          find app/build -name "*.apk" 2>/dev/null || true

      - name: Collect release APK
        id: collect
        run: |
          mkdir -p apk-out
          for f in $(find app/build/outputs/apk -name "*.apk" -type f); do
            cp "$f" "apk-out/HKATE-release.apk"
            # SHA-256 校驗檔：App 內下載嗰陣會自動攞嚟對比
            # 格式「<hash>  <檔名>」，淨係取第一行 hash 就得
            (cd apk-out && sha256sum HKATE-release.apk > HKATE-release.apk.sha256)
          done
          ls -lh apk-out
          test -n "$(ls -A apk-out)" || { echo "::error::no APK produced"; exit 1; }

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hkate-release-apk
          path: apk-out/*.apk

      - name: Attach APK to release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 失敗時把完整 log 印落 step log（唔使下載 artifact 都睇到），
      # 並抽出「最有用嗰 60 行」—— 冇 log 就好難判斷錯乜。
      - name: Report which step failed
        if: always()
        run: |
          echo "### 每一步嘅結果"
          echo ""
          echo "| 步驟 | 結果 |"
          echo "|---|---|"
          echo "| Rust 工具鏈 + 源碼 | ${{ steps.rust.outcome }} |"
          echo "| Android SDK 元件 | ${{ steps.sdk.outcome }} |"
          echo "| 單元測試 | ${{ steps.unittest.outcome }} |"
          echo "| Gradle build | ${{ steps.gradle.outcome }} |"
          echo "| 收集 APK | ${{ steps.collect.outcome }} |"
          echo ""
          echo "> \`failure\` 嗰一步就係今次紅嘅原因；\`skipped\` = 上一步失敗所以冇行到。"

      # ⚠️ 之前嘅條件係：
      #     if: failure() && hashFiles('/tmp/release-build.log') != ''
      #
      # `hashFiles()` **淨係會掃 $GITHUB_WORKSPACE**，而 /tmp 喺 workspace 出面 ——
      # 所以佢永遠返空字串 → 條件永遠 false → **呢一步永遠 skipped**。
      #
      # 結果就係：Gradle 失敗咗，但完整 log 從來冇印出嚟，你淨係見到一句
      #     Error: Process completed with exit code 1.
      # 完全唔知邊度錯 —— 呢個正係「點解次次都淨係得一行」嘅原因。
      #
      # 而家改為 `if: failure()`，並且把 log 抄入 workspace（上傳都穩陣啲）。
      - name: Dump build log on failure
        id: dumplog
        if: failure()
        run: |
          mkdir -p build-logs
          cp /tmp/*-build.log build-logs/ 2>/dev/null || true
          echo "=============== 完整 release-build.log ==============="
          cat /tmp/release-build.log 2>/dev/null || echo "(冇 release-build.log)"
          echo
          echo "=============== 錯誤摘要（頭 80 行，會同時變紅色 annotation）==============="
          grep -nE 'e: |error: |FAILED|FAILURE:|\* What went wrong|Caused by|Execution failed' \
            /tmp/release-build.log 2>/dev/null | head -80 \
            | while IFS= read -r line; do echo "::error::$line"; echo "$line"; done
          echo
          echo "=============== 最尾 40 行 ==============="
          tail -40 /tmp/release-build.log 2>/dev/null || true

      - name: Write errors to job summary
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo
            echo "### Error excerpt"
            echo '```'
            grep -h -E "^(e: |error: |FAILURE: |.*What went wrong)" -A 4 /tmp/*-build.log 2>/dev/null | head -80 || echo "(no error lines captured)"
            echo '```'
            echo
            echo "Full log: download the **build-log** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/*-build.log
          if-no-files-found: ignore

  # =====================================================================
  # 把 APK 提交到 repo 嘅 apk 分支 / builds 目錄，
  # 令 APK 可以直接喺 repo 檔案列表度撳 latest.apk 下載
  # （同 ci-bot 上傳嘅做法一樣）。
  #
  # 默認係「本 repo」，內置 GITHUB_TOKEN 就夠，唔使另外設定 PAT。
  #       只有想推去「另一個」repo 時先需要 PUBLISH_TOKEN：
  #       Settings ▸ Developer settings ▸ Personal access tokens 開一個
  #       classic token（scope 揀 repo），再加落本 repo 嘅
  #       Settings ▸ Secrets ▸ Actions。
  # =====================================================================
  publish:
    needs: build
    runs-on: ubuntu-latest
    # 關鍵：發布失敗唔應該拖垮成個 workflow —— APK 已經喺 build job 嘅
    # artifact 度，呢度只係額外抄一份去 apk 分支。開咗 continue-on-error 之後，
    # 就算 git push 失敗（shallow 被拒 / 分支保護 / token 權限），Actions 只會
    # 顯示黃色警告，成個 run 仍然係綠色。
    continue-on-error: true
    # 點解會「This job was skipped」：
    #   之前淨係喺 workflow_dispatch 或 push tag 時先跑，
    #   所以 push 去 main 嗰陣成個表達式係 false → job 被跳過。
    #   而家三種情況都會發布：
    #     ① push 去 main
    #     ② push v* tag
    #     ③ 手動 Run workflow 且 inputs.publish 係 true
    #   註：唔加 always() 係刻意嘅 —— build 失敗時就唔應該發布，
    #   needs 關係會令呢個 job 自動取消，唔會浪費時間。
    if: >-
      ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
          || github.event_name == 'workflow_dispatch' && inputs.publish }}

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: hkate-release-apk
          path: apk-in

      - name: Check publish settings
        id: tok
        run: |
          TARGET="${{ github.event.inputs.target_repo || github.repository }}"
          SELF="${{ github.repository }}"
          echo "目標 repo：$TARGET（本 repo：$SELF）"
          if [ "$TARGET" = "$SELF" ] || [ -n "${{ secrets.PUBLISH_TOKEN }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ "$TARGET" = "$SELF" ]; then
              echo "同 repo 推送 —— 用內置 GITHUB_TOKEN"
            else
              echo "跨 repo 推送 —— 用 PUBLISH_TOKEN"
            fi
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::跨 repo 推送需要 PUBLISH_TOKEN，今次跳過（APK 仍然喺 Actions artifact 度）"
          fi

      - name: Resolve target settings
        if: steps.tok.outputs.skip == 'false'
        id: cfg
        run: |
          # 用 ${VAR:-default} 而唔係 `[ -z x ] && x=...`：
          # 後者喺 `set -e` 之下，當變數非空時會返回非零、直接成個 step 失敗
          repo="${{ github.event.inputs.target_repo || github.repository }}"
          br="${{ github.event.inputs.target_branch || 'apk' }}"
          dir="${{ github.event.inputs.target_dir || 'builds' }}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "branch=$br" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "目標：$repo （分支 $br，目錄 $dir）"

      - name: Clone target repo
        if: steps.tok.outputs.skip == 'false'
        run: |
          set -e
          # 同 repo 用內置 GITHUB_TOKEN 就夠；只有跨 repo 先需要 PAT（PUBLISH_TOKEN）
          TOKEN="${{ secrets.PUBLISH_TOKEN || github.token }}"
          export TOKEN
          BR="${{ steps.cfg.outputs.branch }}"

          rm -rf target-repo && mkdir target-repo && cd target-repo
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ steps.cfg.outputs.repo }}.git"

          # 睇下目標分支存唔存在（pipefail 必要：唔係 ls-remote 失敗會被 grep 吞掉）
          set -o pipefail
          if git ls-remote --heads origin "$BR" 2>/dev/null | grep -q "refs/heads/$BR$"; then
            set +o pipefail
            echo "分支 $BR 已存在 → fetch 佢"
            # 重點：一定要寫「全 refspec」。
            # 淨係寫 `git fetch origin apk` 只會放落 FETCH_HEAD，
            # 唔會建立 refs/remotes/origin/apk，下一句 checkout 就會報
            # fatal: 'origin/apk' is not a commit
            git fetch --depth 1 origin "refs/heads/$BR:refs/remotes/origin/$BR"
            git checkout -q -B "$BR" "refs/remotes/origin/$BR"
          else
            set +o pipefail
            echo "分支 $BR 唔存在 → 開 orphan（唔會掝走 main 嘅歷史）"
            git checkout -q --orphan "$BR"
            git rm -rf --cached . -q || true
          fi

      - name: Copy APK into target repo
        if: steps.tok.outputs.skip == 'false'
        run: |
          set -e
          cd target-repo
          mkdir -p "${{ steps.cfg.outputs.dir }}"
          SRC="$(ls ../apk-in/*.apk | head -1)"
          echo "來源：$SRC"
          VER="${{ needs.build.outputs.version_name || '1.0.0' }}"
          cp "$SRC" "${{ steps.cfg.outputs.dir }}/hkate-v${VER}-run${{ github.run_number }}.apk"
          cp "$SRC" "${{ steps.cfg.outputs.dir }}/latest.apk"
          (cd "${{ steps.cfg.outputs.dir }}" && sha256sum latest.apk > latest.apk.sha256)
          # 只保留 latest.apk + 最近 5 個版本檔（關咗 keep_history 就只留 latest）
          if [ "${{ github.event.inputs.keep_history || 'true' }}" != "true" ]; then
            # 只保留 latest.apk + 最近 5 個版本檔（sort -V 先啱：run9 < run10）
            ls -1 ${{ steps.cfg.outputs.dir }}/*.apk 2>/dev/null \
              | grep -v '/latest.apk$' \
              | grep -v '/hkate-v'"$VER"'-run${{ github.run_number }}.apk$' \
              | sort -V | head -n -5 | xargs -r rm -f
          fi
          ls -lh "${{ steps.cfg.outputs.dir }}"

      - name: Commit and push
        if: steps.tok.outputs.skip == 'false'
        run: |
          set -e
          cd target-repo
          git add -A "${{ steps.cfg.outputs.dir }}"
          if git diff --cached --quiet; then
            echo "冇變化，唔使提交"
            exit 0
          fi
          git commit -m "APK run ${{ github.run_number }} (${{ github.sha }})"

          # shallow clone 有機會被 server 以 "shallow update not allowed" 拒絕，
          # 咁就攞完整歷史再推一次
          if git push origin "HEAD:${{ steps.cfg.outputs.branch }}" 2>/tmp/push.err; then
            echo "推送成功"
          else
            echo "第一次推送失敗，攞完整歷史重試："
            tail -3 /tmp/push.err 2>/dev/null || true
            git fetch --unshallow origin || true
            git push origin "HEAD:${{ steps.cfg.outputs.branch }}"
            echo "重試成功"
          fi
          echo "已推送 → ${{ steps.cfg.outputs.repo }}#${{ steps.cfg.outputs.branch }}/${{ steps.cfg.outputs.dir }}"

      - name: Summary
        if: steps.tok.outputs.skip == 'false'
        run: |
          {
            echo "## APK 已提交"
            echo
            echo "- Repo：**${{ steps.cfg.outputs.repo }}**"
            echo "- 分支：\`${{ steps.cfg.outputs.branch }}\`"
            echo "- 路徑：\`${{ steps.cfg.outputs.dir }}/latest.apk\`"
            echo
            echo "直接喺 repo 檔案列表撳 \`latest.apk\` → Download 就可以裝。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose push failure
        if: failure() && steps.tok.outputs.skip == 'false'
        run: |
          {
            echo "## ⚠️ 發布步驟失敗（唔影響 APK）"
            echo
            echo "APK 仍然喺 **build** job 嘅 artifact \`hkate-release-apk\` 度。"
            echo
            echo "常見原因："
            echo "1. 分支有 branch protection —— Settings ▸ Branches 解除，或改推去冇保護嘅分支"
            echo "2. shallow clone 被拒 —— 已自動 \`--unshallow\` 重試"
            echo "3. Token 權限唔夠 —— 同 repo 要 \`contents: write\`，跨 repo 要 PAT"
            echo
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          tail -20 /tmp/push.err 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '\`' >> "$GITHUB_STEP_SUMMARY"
