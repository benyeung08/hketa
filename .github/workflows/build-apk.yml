name: Build HKETA signed release APK

# 正式版只在 main push / v* tag / 手動觸發時出；PR 不跑（避免 fork PR 拿不到簽名 secrets）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
      # cordova-android 15.1.0 official ceiling = API 36 (Android 16).
      # The produced APK still installs on Android 17 (API 37) devices — no maxSdk is set.
      - name: Accept licenses and install Android SDK (API 36)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          sdkmanager --list_installed | grep -E "android-36|36\.0\.0" || true

      - name: Install npm dependencies
        run: npm install

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Bundle TypeScript into www/js/app.js
        run: npm run build

      - name: Add Android platform (Cordova Android 15.1.0)
        run: npx cordova platform add android@15.1.0

      - name: Add local Kotlin Cordova plugin
        run: npx cordova plugin add ./native-plugin/hketa-native

      - name: Verify local Kotlin plugin is installed
        run: npx cordova plugin ls

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.HKETA_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          KEY_PW: ${{ secrets.HKETA_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_B64" ] && missing+=(HKETA_KEYSTORE_BASE64)
          [ -z "$STORE_PW" ] && missing+=(HKETA_KEYSTORE_PASSWORD)
          [ -z "$KEY_ALIAS" ] && missing+=(HKETA_KEY_ALIAS)
          [ -z "$KEY_PW" ] && missing+=(HKETA_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}"
            echo "::error::See README → Release signing, then add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Signing secrets present"

      # build.json 由 secrets 動態產生，不進 git；密碼用 node 寫入以避免特殊字元破壞 JSON。
      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.HKETA_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          KEY_PW: ${{ secrets.HKETA_KEY_PASSWORD }}
          KEYSTORE_TYPE: ${{ secrets.HKETA_KEYSTORE_TYPE }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          node -e "
            const fs = require('fs');
            const cfg = { android: { release: {
              keystore: 'release.keystore',
              storePassword: process.env.STORE_PW,
              alias: process.env.KEY_ALIAS,
              password: process.env.KEY_PW,
              keystoreType: process.env.KEYSTORE_TYPE || 'PKCS12'
            }}};
            fs.writeFileSync('build.json', JSON.stringify(cfg, null, 2));
          "
          npx cordova build android --release --buildConfig=build.json
          rm -f build.json release.keystore

      - name: Verify the APK is signed
        run: |
          APK=$(find platforms/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK" || { echo "::error::No release APK produced"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          # Assert the shipped APK declares min 26 (Android 8.0) / target 36.
          # No maxSdk is emitted, so Android 17 (API 37) and newer stay installable.
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          BADGE=$("$AAPT2" dump badging "$APK")
          echo "$BADGE" | grep -q "sdkVersion:'26'" || {
            echo "::error::minSdkVersion is not 26 (Android 8.0)"; exit 1; }
          echo "$BADGE" | grep -q "targetSdkVersion:'36'" || {
            echo "::error::targetSdkVersion is not 36 (Android 16)"; exit 1; }
          echo "$BADGE" | grep -E "sdkVersion:|targetSdkVersion:"
          echo "$BADGE" | grep -q "maxSdkVersion" && {
            echo "::error::maxSdkVersion must not be set"; exit 1; } || true
          cp "$APK" HKETA-release.apk
          ls -lh HKETA-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HKETA-release-signed-apk
          path: HKETA-release.apk
          if-no-files-found: error

      - name: Attach signed APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HKETA-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
