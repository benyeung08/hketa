name: Build HKETA Hybrid APK

# 只做一件事：產出 APK。不部署任何網頁、不需要 GitHub Pages、不需要 Pages 權限。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hketa-hybrid-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android resource layout
        run: |
          test -f android/app/src/main/res/values/strings.xml || { echo "::error::缺少 res/values/strings.xml，請先執行 bash fix_layout.sh"; exit 1; }
          test -f android/app/src/main/res/values/styles.xml  || { echo "::error::缺少 res/values/styles.xml，請先執行 bash fix_layout.sh"; exit 1; }
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || { echo "::error::缺少 res/mipmap 圖示"; exit 1; }

      - name: Bundle web assets into APK
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -R web/. android/app/src/main/assets/web/
          ls -la android/app/src/main/assets/web

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Decode signing keystore (optional)
        env:
          B64: ${{ secrets.HKETA_KEYSTORE_B64 }}
        if: env.B64 != ''
        run: echo "$B64" | base64 -d > android/keystore.jks

      - name: Assemble APK
        working-directory: android
        env:
          HKETA_KEYSTORE: ${{ secrets.HKETA_KEYSTORE_B64 != '' && 'keystore.jks' || '' }}
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          HKETA_KEY_PASSWORD: ${{ secrets.HKETA_KEY_PASSWORD }}
          # 打 tag 時用 tag 名稱當版本號；其餘沿用 build.gradle.kts 預設值
          HKETA_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Drop unsigned release APK
        # 未設 Secrets 時 assembleRelease 會產出 app-release-unsigned.apk，
        # 這種 APK 使用者裝不到，不應該進 Artifacts / Release。
        run: |
          find android/app/build/outputs/apk/release -name '*unsigned*.apk' -delete || true
          find android/app/build/outputs/apk -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        with:
          name: hketa-hybrid-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
