name: Build HK ETA APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-latest migrated to Ubuntu 26 on 2026-10-19. Pin 24.04 so the
    # preinstalled Android SDK layout and Node versions stay predictable.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # SELF_CONTAINED_PREFLIGHT
      # Deliberately INLINE: the previous version called scripts/preflight.py,
      # which itself was missing when files were uploaded one-by-one, so the
      # check could only say "preflight.py is missing" and nothing else.
      # This version needs no repo file at all, lists EVERY missing file, AND
      # catches "file exists but is still the old version" content drift.
      - name: Preflight - verify uploaded files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          R = Path('.')
          req = [
              '.github/workflows/build-apk.yml',
              'settings.gradle.kts', 'build.gradle.kts', 'gradle.properties',
              'gradlew', 'gradle/wrapper/gradle-wrapper.properties',
              'app/build.gradle.kts', 'app/proguard-rules.pro',
              'app/hketa-debug.keystore', 'app/icon-source.png',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/ic_launcher-playstore.png',
              'scripts/check_api_fields.py',
              'scripts/pin_signing_fingerprint.py',
              'scripts/make_launcher_icons.py',
              'app/src/main/res/xml/file_paths.xml',
              'app/src/main/res/values/strings.xml',
              'app/src/main/res/values/colors.xml',
              'app/src/main/res/values-night/colors.xml',
              'app/src/main/res/layout/activity_main.xml',
              'app/src/main/res/layout/activity_settings.xml',
              # APP1933-style shell
              'app/src/main/res/layout/item_route_card.xml',
              'app/src/main/res/layout/item_favorite.xml',
              'app/src/main/res/drawable/bg_route_badge.xml',
              'app/src/main/res/drawable/bg_trip_chip.xml',
              'app/src/main/java/hk/eta/app/ui/App1933Format.kt',
              'app/src/main/java/hk/eta/app/ui/CardAdapters.kt',
              'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml',
              'app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml',
          ]
          for d in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              for n in ('ic_launcher.png', 'ic_launcher_round.png',
                        'ic_launcher_background.png', 'ic_launcher_foreground.png'):
                  req.append(f'app/src/main/res/mipmap-{d}/{n}')

          key_sources = [
              'app/src/main/java/hk/eta/app/HkEtaApp.kt',
              'app/src/main/java/hk/eta/app/api/HttpJson.java',
              'app/src/main/java/hk/eta/app/api/AppUpdate.java',
              'app/src/main/java/hk/eta/app/api/RouteDataStore.java',
              'app/src/main/java/hk/eta/app/ui/MainActivity.kt',
              'app/src/main/java/hk/eta/app/ui/SettingsActivity.kt',
              'app/src/main/java/hk/eta/app/ui/ApkSignature.kt',
          ]
          req += key_sources

          errs = []
          if (R / 'hketa/app/build.gradle.kts').exists() \
                  and not (R / 'app/build.gradle.kts').exists():
              errs.append('多咗一層 hketa/ 資料夾：請把 hketa/ *入面* 嘅檔案放 repo 根目錄')

          missing = [p for p in req if not (R / p).is_file()]
          if missing:
              errs.append(f'缺少 {len(missing)} 個檔案：')
              errs += [f'  - {p}' for p in missing]
          srcs = list((R / 'app/src/main/java').rglob('*.java')) + \
                 list((R / 'app/src/main/java').rglob('*.kt'))
          if len(srcs) < 21:
              errs.append(f'原始碼得 {len(srcs)} 個 .java/.kt（預期 >= 21），可能只上傳咗部分')

          # CONTENT DRIFT: a file can exist but still be the OLD version when
          # only some files are uploaded. (Run 44055490312 follow-up: the new
          # checker passed ~140 checks but .gitignore and the Manifest were old.)
          drift = [
              ('.gitignore', '/app/hketa-release.keystore',
               '.gitignore 缺 /app/hketa-release.keystore',
               '加一行：/app/hketa-release.keystore'),
              ('app/src/main/AndroidManifest.xml',
               'android:roundIcon="@mipmap/ic_launcher_round"',
               'AndroidManifest.xml roundIcon 未指向 ic_launcher_round',
               '改成：android:roundIcon="@mipmap/ic_launcher_round"'),
              ('app/build.gradle.kts', 'hketaDev',
               'app/build.gradle.kts 缺固定 signingConfigs',
               '加入 signingConfigs { create("hketaDev") { ... } } 並讓 debug/release 使用'),
              ('app/src/main/res/values/strings.xml',
               '<string name="default_github_repo">benyeung08/hketa</string>',
               'strings.xml 缺內建 default_github_repo',
               '改成：<string name="default_github_repo">benyeung08/hketa</string>'),
              ('app/src/main/res/layout/activity_main.xml',
               'android:id="@+id/pageHome"',
               'activity_main.xml 仍係舊單頁版面（缺 APP1933 四分頁）',
               '由完整 zip 覆蓋 activity_main.xml（同時要傳 App1933Format.kt / CardAdapters.kt）'),
          ]
          for path, needle, msg, fix in drift:
              p = R / path
              if p.is_file() and needle not in p.read_text(encoding='utf-8'):
                  errs.append(f'檔案存在但內容仍係舊版：{msg} → 修復：{fix}')

          # BINARY INTEGRITY: a file can exist, be non-empty, and STILL be a
          # corrupted/text-mangled upload (e.g. a keystore saved as plain text
          # via the web editor). That fails much later at signing/AAPT2.
          ks = R / 'app/hketa-debug.keystore'
          if ks.is_file():
              try:
                  raw = ks.read_bytes()
              except OSError:
                  raw = b''
              if raw[:2] != b'\x30\x82' and raw[:4] != b'\xfe\xed\xfe\xed':
                  errs.append('app/hketa-debug.keystore 唔係有效 PKCS12/JKS 二進位檔'
                              '（可能被當文字上傳／損毀）→ 由 zip 原檔重新覆蓋')
              if len(raw) < 1000:
                  errs.append(f'app/hketa-debug.keystore 得 {len(raw)} bytes，'
                              '疑似空檔／佔位檔 → 由 zip 原檔重新覆蓋')
          pngs = [R / 'app/icon-source.png',
                  R / 'app/src/main/ic_launcher-playstore.png']
          pngs += sorted((R / 'app/src/main/res').glob('mipmap-*/ic_launcher*.png'))
          for p in pngs:
              if p.is_file() and p.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                  errs.append(str(p.relative_to(R)) + ' 唔係有效 PNG（可能被當文字上傳／損毀）')

          if errs:
              print('::error::HK ETA 上傳完整性檢查失敗')
              for e in errs:
                  print(f'::error::{e}')
              print('::error::唔好逐個檔改：新 zip 入面所有檔案全部已驗證正確')
              print('::error::唯一動作：解壓 hketa-github.zip → cd hketa → git add . && git commit -m "Full sync" && git push origin main')
              print('::error::若堅持用網頁 upload，必須一次過拖「成個資料夾」，連 .github/ 同 .gitignore 都要傳')
              sys.exit(1)
          print(f'preflight OK：{len(req)} 個必要檔案齊全，{len(srcs)} 個原始碼檔案。')
          print('提示：app/hketa-release.keystore 係刻意唔上傳（由 CI Secrets 注入）。')
          PY

      # Pure-Python check: no JDK / SDK needed, so it fails fast too.
      - name: Check API field names against official samples
        run: python3 scripts/check_api_fields.py

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # REMOVED: android-actions/setup-android@v3 (Node 20 action, was the
      # failing "Android SDK" step on Ubuntu 26 / Node 24 runners).
      # GitHub-hosted Ubuntu images already ship an Android SDK; just locate it.
      - name: Locate Android SDK (preinstalled on runner)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for c in /usr/local/lib/android/sdk /usr/lib/android-sdk "$HOME/Android/Sdk"; do
              [ -d "$c" ] && SDK="$c" && break
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::搵唔到 Android SDK；ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            exit 1
          fi
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                     "$SDK/cmdline-tools/bin/sdkmanager" \
                     "$SDK/tools/bin/sdkmanager"; do
              [ -x "$c" ] && SDKMANAGER="$c" && break
            done
          fi
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "::error::搵唔到 sdkmanager（SDK=$SDK）"
            find "$SDK" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version || true
          echo "### Android SDK: \`$SDK\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Accept licenses and install SDK 34
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      # Every runner uses the SAME committed development keystore, so debug and
      # fallback-release APKs always share one certificate. Prints the fingerprint.
      - name: Verify committed dev keystore
        run: |
          keytool -list -v \
            -keystore app/hketa-debug.keystore \
            -storepass 'hketa-dev-2026' -alias hketa 2>/dev/null \
            | grep 'SHA256:' | head -1 | tee dev-signing-sha256.txt
          echo "### 固定開發簽章" >> "$GITHUB_STEP_SUMMARY"
          cat dev-signing-sha256.txt >> "$GITHUB_STEP_SUMMARY"

      # Optional: a real production keystore supplied through repo Secrets.
      # If absent, release signing falls back to the dev key (same certificate).
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HKETA_KEYSTORE_BASE64: ${{ secrets.HKETA_KEYSTORE_BASE64 }}
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          HKETA_KEY_PASSWORD: ${{ secrets.HKETA_KEY_PASSWORD }}
        run: |
          if [ -n "$HKETA_KEYSTORE_BASE64" ]; then
            echo "$HKETA_KEYSTORE_BASE64" | base64 -d > app/hketa-release.keystore
            echo "HKETA_KEYSTORE_PASSWORD=$HKETA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "HKETA_KEY_ALIAS=${HKETA_KEY_ALIAS:-hketa}" >> "$GITHUB_ENV"
            echo "HKETA_KEY_PASSWORD=$HKETA_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "HKETA_CUSTOM_KEY=true" >> "$GITHUB_ENV"
            echo "Using injected release keystore."
          else
            echo "No HKETA_KEYSTORE_BASE64 secret: falling back to the committed dev key (identical certificate)."
          fi

      # Pin the fingerprint of the exact keystore Gradle is about to use.
      - name: Pin expected signing fingerprint
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
        run: |
          if [ -f app/hketa-release.keystore ]; then
            KS=app/hketa-release.keystore
            PASS="${HKETA_KEYSTORE_PASSWORD:-hketa-dev-2026}"
            ALIAS="${HKETA_KEY_ALIAS:-hketa}"
          else
            KS=app/hketa-debug.keystore
            PASS=hketa-dev-2026
            ALIAS=hketa
          fi
          FP=$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" 2>/dev/null \
               | grep -m1 'SHA256:' | cut -d: -f2- | tr -d ' ')
          python3 scripts/pin_signing_fingerprint.py "$FP"

      # The repository intentionally ships no gradle-wrapper.jar binary.
      # Grab the official Gradle distribution instead, so CI is self-contained.
      - name: Gradle 8.7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle-8.7-bin.zip" \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.7-bin.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      # NO --stacktrace on purpose: it appends 250+ Gradle-internal frames at
      # the END, so the user only ever sees "at org.gradle.internal..." and
      # "BUILD FAILED" instead of the real cause. Without it, Gradle's own tail
      # IS the answer (FAILURE / What went wrong / Execution failed for task).
      # --console=plain keeps output readable in the Actions log viewer.
      # tee + pipefail still preserve the full log and the real exit code.
      - name: Assemble debug APK
        id: assemble_debug
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build-debug.log

      - name: Show real Gradle error
        if: failure() && steps.assemble_debug.outcome == 'failure'
        run: python3 scripts/show_build_error.py build-debug.log

      - name: Upload full Gradle error log
        if: failure() && steps.assemble_debug.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hketa-gradle-logs
          path: build-debug.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hketa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Assemble signed release APK
        id: assemble_release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build-release.log

      - name: Show real Gradle error (release)
        if: failure() && steps.assemble_release.outcome == 'failure'
        run: python3 scripts/show_build_error.py build-release.log

      - name: Upload full Gradle release log
        if: failure() && steps.assemble_release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hketa-gradle-release-log
          path: build-release.log
          if-no-files-found: warn

      # Fail the release if the APK certificate differs from the pinned value.
      - name: Verify APK signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --print-certs "$APK" | tee apksigner-output.txt
          APK_FP=$(grep -m1 'SHA-256 digest' apksigner-output.txt \
                   | cut -d: -f2- | tr -d ' ' | tr 'a-f' 'A-F')
          PIN=$(python3 -c "import re;print(re.search(r'<string name=\"expected_signing_sha256\">([^<]*)</string>', open('app/src/main/res/values/strings.xml', encoding='utf-8').read()).group(1))")
          echo "APK certificate : $APK_FP"
          echo "Pinned value    : $PIN"
          if [ "$APK_FP" != "$PIN" ]; then
            echo "::error::APK signing certificate does not match the pinned fingerprint"
            exit 1
          fi
          {
            echo "HK ETA APK signing certificate"
            echo "Tag: ${GITHUB_REF_NAME}"
            echo "SHA-256: $APK_FP"
          } > SIGNING_FINGERPRINT.txt
          echo "### Release APK 簽章 SHA-256: \`$APK_FP\`" >> "$GITHUB_STEP_SUMMARY"
          cp "$APK" "hketa-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hketa-${{ github.ref_name }}.apk
            SIGNING_FINGERPRINT.txt
          generate_release_notes: true
