name: Build HKETA Hybrid APK

# 只做一件事：產出 APK。不部署任何網頁、不需要 GitHub Pages、不需要 Pages 權限。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hketa-hybrid-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # 明確裝 Gradle 8.9，避免 runner 預裝版本浮動令 `gradle wrapper` 失敗
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle web assets into APK
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -R web/. android/app/src/main/assets/web/
          ls -la android/app/src/main/assets/web

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Decode signing keystore (optional)
        env:
          B64: ${{ secrets.HKETA_KEYSTORE_B64 }}
        if: env.B64 != ''
        run: echo "$B64" | base64 -d > android/keystore.jks

      - name: Assemble APK
        working-directory: android
        env:
          # 路徑相對於 android/（Gradle projectDir），對應上一步寫入的位置
          HKETA_KEYSTORE: ${{ secrets.HKETA_KEYSTORE_B64 != '' && 'keystore.jks' || '' }}
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          HKETA_KEY_PASSWORD: ${{ secrets.HKETA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: hketa-hybrid-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
