name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 手動觸發

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ============================================================
      #  Install Android SDK
      #  ============================================================
      - name: Install Android SDK
        run: |
          set -eux
          
          SDK_DIR="$HOME/android-sdk"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          
          mkdir -p "$SDK_DIR/cmdline-tools"
          cd /tmp
          
          echo "📦 下載 command-line tools..."
          # 使用最新的 commandlinetools
          curl -sL -o cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          
          ls -la cmdtools.zip
          
          unzip -q cmdtools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          
          # 驗證 sdkmanager 存在
          ls -la "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          
          echo "✅ Android SDK 準備完成"

      - name: Install SDK packages
        run: |
          set -eux
          
          SDK_DIR="$HOME/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          
          # 接受所有授權
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          
          # 更新 repository XML
          "$SDKMANAGER" --update
          
          # 診斷：列出所有可用 platforms
          echo "=== 可用 platforms ==="
          "$SDKMANAGER" --list 2>/dev/null | grep "platforms;android" | sort -t'-' -k2 -n | tail -10
          
          # 安裝所需套件
          echo "=== 安裝 SDK packages ==="
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-38" \
            "build-tools;38.0.0"
          
          echo "=== 已安裝 packages ==="
          "$SDKMANAGER" --list_installed 2>/dev/null

      - name: Verify SDK Installation
        run: |
          SDK_DIR="$HOME/android-sdk"
          echo "📂 SDK 目錄："
          ls "$SDK_DIR/"
          echo ""
          echo "📂 Platforms："
          ls "$SDK_DIR/platforms/" 2>/dev/null && echo "✅ platforms;android-38 已安裝" || echo "❌ platforms 未安裝"
          echo ""
          echo "📂 Build-tools："
          ls "$SDK_DIR/build-tools/" 2>/dev/null || echo "❌ build-tools 未安裝"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ============================================================
      #  簽名金鑰
      #  ============================================================
      - name: Setup signing keystore
        id: keystore
        run: |
          mkdir -p androidApp/signing
          
          if [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > androidApp/signing/release-key.jks
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "🔑 使用已儲存的簽名金鑰"
          else
            echo "🔑 生成新的長期簽名金鑰..."
            STORE_PASS="hketa-$(date +%s)-$(echo $RANDOM | md5sum | cut -c1-8)"
            KEY_ALIAS="hketa"
            
            keytool -genkeypair \
              -v \
              -keystore androidApp/signing/release-key.jks \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10950 \
              -dname "CN=HK ETA App, OU=Open Source, O=HK ETA, L=Hong Kong, S=HK, C=HK"
            
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASS=$STORE_PASS" >> $GITHUB_ENV
            echo "✅ 新簽名金鑰已生成"
          fi

      - name: Upload keystore backup
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore-backup
          path: androidApp/signing/release-key.jks
          retention-days: 90

      # ============================================================
      #  建置 APK
      #  ============================================================
      - name: Build Release APK
        working-directory: androidApp
        run: |
          set -eux
          chmod +x gradlew
          
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/signing/release-key.jks \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hketa-release-apk
          path: androidApp/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: hketa-release-apk

      - name: Get version
        id: version
        run: echo "count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.count }}
          name: HK ETA v${{ steps.version.outputs.count }}
          body: |
            ## HK ETA 自動建置

            由 GitHub Actions 自動產生的已簽名 APK 檔案。

            ### 建置資訊
            - 提交：`${{ github.sha }}`
            - 版本碼：${{ steps.version.outputs.count }}

            > 🔐 使用長期一致簽名金鑰，可直接覆蓋安裝舊版本。
          files: |
            *.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
