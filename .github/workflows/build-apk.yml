          for path, needle, msg, fix in drift:
              p = R / path
              if p.is_file() and needle not in p.read_text(encoding='utf-8'):
                  errs.append(f'檔案存在但內容仍係舊版：{msg} → 修復：{fix}')

          # BINARY INTEGRITY: a file can exist, be non-empty, and STILL be a
          # corrupted/text-mangled upload (e.g. a keystore saved as plain text
          # via the web editor). That fails much later at signing/AAPT2.
          ks = R / 'app/hketa-debug.keystore'
          if ks.is_file():
              try:
                  raw = ks.read_bytes()
              except OSError:
                  raw = b''
              if raw[:2] != b'\x30\x82' and raw[:4] != b'\xfe\xed\xfe\xed':
                  errs.append('app/hketa-debug.keystore 唔係有效 PKCS12/JKS 二進位檔'
                              '（可能被當文字上傳／損毀）→ 由 zip 原檔重新覆蓋')
              if len(raw) < 1000:
                  errs.append(f'app/hketa-debug.keystore 得 {len(raw)} bytes，'
                              '疑似空檔／佔位檔 → 由 zip 原檔重新覆蓋')
          pngs = [R / 'app/icon-source.png',
                  R / 'app/src/main/ic_launcher-playstore.png']
          pngs += sorted((R / 'app/src/main/res').glob('mipmap-*/ic_launcher*.png'))
          for p in pngs:
              if p.is_file() and p.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                  errs.append(str(p.relative_to(R)) + ' 唔係有效 PNG（可能被當文字上傳／損毀）')

          if errs:
              print('::error::HK ETA 上傳完整性檢查失敗')
              for e in errs:
                  print(f'::error::{e}')
              print('::error::唔好逐個檔改：新 zip 入面所有檔案全部已驗證正確')
              print('::error::唯一動作：解壓 hketa-github.zip → cd hketa → git add . && git commit -m "Full sync" && git push origin main')
              print('::error::若堅持用網頁 upload，必須一次過拖「成個資料夾」，連 .github/ 同 .gitignore 都要傳')
              sys.exit(1)
          print(f'preflight OK：{len(req)} 個必要檔案齊全，{len(srcs)} 個原始碼檔案。')
          print('提示：app/hketa-release.keystore 係刻意唔上傳（由 CI Secrets 注入）。')
          PY

      # Pure-Python check: no JDK / SDK needed, so it fails fast too.
      - name: Check API field names against official samples
        run: python3 scripts/check_api_fields.py

      # MAVEN_429_RETRY: setup-java's built-in Gradle cache keeps
      # ~/.gradle/caches across runs, so jsr305 / AGP / Kotlin artifacts are
      # not re-downloaded every time. Fewer requests = far fewer HTTP 429
      # "Too Many Requests" from repo.maven.apache.org on shared runner IPs.
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # REMOVED: android-actions/setup-android@v3 (Node 20 action, was the
      # failing "Android SDK" step on Ubuntu 26 / Node 24 runners).
      # GitHub-hosted Ubuntu images already ship an Android SDK; just locate it.
      - name: Locate Android SDK (preinstalled on runner)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for c in /usr/local/lib/android/sdk /usr/lib/android-sdk "$HOME/Android/Sdk"; do
              [ -d "$c" ] && SDK="$c" && break
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::搵唔到 Android SDK；ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            exit 1
          fi
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                     "$SDK/cmdline-tools/bin/sdkmanager" \
                     "$SDK/tools/bin/sdkmanager"; do
              [ -x "$c" ] && SDKMANAGER="$c" && break
            done
          fi
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "::error::搵唔到 sdkmanager（SDK=$SDK）"
            find "$SDK" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version || true
          echo "### Android SDK: \`$SDK\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Accept licenses and install SDK 34
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      # Every runner uses the SAME committed development keystore, so debug and
      # fallback-release APKs always share one certificate. Prints the fingerprint.
      - name: Verify committed dev keystore
        run: |
          keytool -list -v \
            -keystore app/hketa-debug.keystore \
            -storepass 'hketa-dev-2026' -alias hketa 2>/dev/null \
            | grep 'SHA256:' | head -1 | tee dev-signing-sha256.txt
          echo "### 固定開發簽章" >> "$GITHUB_STEP_SUMMARY"
          cat dev-signing-sha256.txt >> "$GITHUB_STEP_SUMMARY"

      # Optional: a real production keystore supplied through repo Secrets.
      # If absent, release signing falls back to the dev key (same certificate).
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HKETA_KEYSTORE_BASE64: ${{ secrets.HKETA_KEYSTORE_BASE64 }}
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          HKETA_KEY_PASSWORD: ${{ secrets.HKETA_KEY_PASSWORD }}
        run: |
          if [ -n "$HKETA_KEYSTORE_BASE64" ]; then
            echo "$HKETA_KEYSTORE_BASE64" | base64 -d > app/hketa-release.keystore
            echo "HKETA_KEYSTORE_PASSWORD=$HKETA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "HKETA_KEY_ALIAS=${HKETA_KEY_ALIAS:-hketa}" >> "$GITHUB_ENV"
            echo "HKETA_KEY_PASSWORD=$HKETA_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "HKETA_CUSTOM_KEY=true" >> "$GITHUB_ENV"
            echo "Using injected release keystore."
          else
            echo "No HKETA_KEYSTORE_BASE64 secret: falling back to the committed dev key (identical certificate)."
          fi

      # Pin the fingerprint of the exact keystore Gradle is about to use.
      - name: Pin expected signing fingerprint
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
        run: |
          if [ -f app/hketa-release.keystore ]; then
            KS=app/hketa-release.keystore
            PASS="${HKETA_KEYSTORE_PASSWORD:-hketa-dev-2026}"
            ALIAS="${HKETA_KEY_ALIAS:-hketa}"
          else
            KS=app/hketa-debug.keystore
            PASS=hketa-dev-2026
            ALIAS=hketa
          fi
          FP=$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" 2>/dev/null \
               | grep -m1 'SHA256:' | cut -d: -f2- | tr -d ' ')
          python3 scripts/pin_signing_fingerprint.py "$FP"

      # The repository intentionally ships no gradle-wrapper.jar binary.
      # Grab the official Gradle distribution instead, so CI is self-contained.
      - name: Gradle 8.7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle-8.7-bin.zip" \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.7-bin.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      # NO --stacktrace on purpose: it appends 250+ Gradle-internal frames at
      # the END, so the user only ever sees "at org.gradle.internal..." and
      # "BUILD FAILED" instead of the real cause. Without it, Gradle's own tail
      # IS the answer (FAILURE / What went wrong / Execution failed for task).
      # --console=plain keeps output readable in the Actions log viewer.
      # tee + pipefail still preserve the full log and the real exit code.
      # MAVEN_429_RETRY: "Received status code 429 from server: Too Many
      # Requests" on https://repo.maven.apache.org/maven2/.../jsr305-3.0.2.pom
      # is Maven Central rate-limiting the SHARED GitHub Actions egress IP.
      # It is NOT a source / upload / signing bug. Retry the whole assemble up
      # to 3 times with a short backoff; give up immediately on any OTHER
      # failure so the real compiler error still reaches the distiller.
      - name: Assemble debug APK
        id: assemble_debug
        run: |
          set -o pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "::group::gradle assembleDebug (attempt $attempt/3)"
            : > build-debug.log
            if gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build-debug.log; then
              echo "::endgroup::"
              ok=1
              break
            fi
            echo "::endgroup::"
            if grep -qE '429|Too Many Requests|Could not GET|Could not resolve|Read timed out|Connection reset|Received status code 5[0-9][0-9]' build-debug.log; then
              if [ "$attempt" -lt 3 ]; then
                delay=$((attempt * 30))
                echo "::warning::Maven Central 429 / 5xx / timeout（共享 IP 限流），${delay}s 後自動重試（$attempt/3）"
                sleep "$delay"
                continue
              fi
              echo "::error::連續 3 次都係依賴下載限流；唔係 code 錯。請等幾分鐘再 Re-run jobs，唔使改任何檔"
            else
              echo "::error::Gradle 失敗唔係依賴下載問題，唔重試，交畀下一個 step 顯示真正錯誤"
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi

      - name: Show real Gradle error
        if: failure() && steps.assemble_debug.outcome == 'failure'
        run: python3 scripts/show_build_error.py build-debug.log

      - name: Upload full Gradle error log
        if: failure() && steps.assemble_debug.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hketa-gradle-logs
          path: build-debug.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hketa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Assemble signed release APK
        id: assemble_release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -o pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "::group::gradle assembleRelease (attempt $attempt/3)"
            : > build-release.log
            if gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build-release.log; then
              echo "::endgroup::"
              ok=1
              break
            fi
            echo "::endgroup::"
            if grep -qE '429|Too Many Requests|Could not GET|Could not resolve|Read timed out|Connection reset|Received status code 5[0-9][0-9]' build-release.log; then
              if [ "$attempt" -lt 3 ]; then
                delay=$((attempt * 30))
                echo "::warning::Maven Central 429 / 5xx / timeout（共享 IP 限流），${delay}s 後自動重試（$attempt/3）"
                sleep "$delay"
                continue
              fi
              echo "::error::連續 3 次都係依賴下載限流；唔係 code 錯。請等幾分鐘再 Re-run jobs，唔使改任何檔"
            else
              echo "::error::Gradle 失敗唔係依賴下載問題，唔重試，交畀下一個 step 顯示真正錯誤"
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi

      - name: Show real Gradle error (release)
        if: failure() && steps.assemble_release.outcome == 'failure'
        run: python3 scripts/show_build_error.py build-release.log

      - name: Upload full Gradle release log
        if: failure() && steps.assemble_release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hketa-gradle-release-log
          path: build-release.log
          if-no-files-found: warn

      # Fail the release if the APK certificate differs from the pinned value.
      - name: Verify APK signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --print-certs "$APK" | tee apksigner-output.txt
          APK_FP=$(grep -m1 'SHA-256 digest' apksigner-output.txt \
                   | cut -d: -f2- | tr -d ' ' | tr 'a-f' 'A-F')
          PIN=$(python3 -c "import re;print(re.search(r'<string name=\"expected_signing_sha256\">([^<]*)</string>', open('app/src/main/res/values/strings.xml', encoding='utf-8').read()).group(1))")
          echo "APK certificate : $APK_FP"
          echo "Pinned value    : $PIN"
          if [ "$APK_FP" != "$PIN" ]; then
            echo "::error::APK signing certificate does not match the pinned fingerprint"
            exit 1
          fi
          {
            echo "HK ETA APK signing certificate"
            echo "Tag: ${GITHUB_REF_NAME}"
            echo "SHA-256: $APK_FP"
          } > SIGNING_FINGERPRINT.txt
          echo "### Release APK 簽章 SHA-256: \`$APK_FP\`" >> "$GITHUB_STEP_SUMMARY"
          # RELEASE_VERSION_GATE: one single, explicitly "release" named APK
          # asset. The in-app updater takes the FIRST .apk asset of the latest
          # Release, so there must be exactly one and it must be the signed
          # production build (never the debug APK).
          cp "$APK" "hketa-${GITHUB_REF_NAME}-release.apk"

      # RELEASE_VERSION_GATE — 對應版本三重校驗 --------------------------------
      # tag (v1.0.0) == build.gradle.kts versionName == ACTUAL APK badging.
      # Fails BEFORE the Release is created, so a version tag can never carry
      # an APK built from an unbumped / stale versionCode / versionName.
      - name: Dump release APK badging (aapt)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDK/build-tools/34.0.0/aapt"
          if [ ! -x "$AAPT" ]; then
            echo "::error::搵唔到 aapt（$AAPT）"
            exit 1
          fi
          "$AAPT" dump badging \
            "app/build/outputs/apk/release/app-release.apk" > apk-badging.txt
          head -1 apk-badging.txt

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/verify_release_version.py \
            --tag "${GITHUB_REF_NAME}" \
            --gradle app/build.gradle.kts \
            --badging apk-badging.txt \
            --apk "hketa-${GITHUB_REF_NAME}-release.apk" \
            --signing apksigner-output.txt \
            --out VERSION_INFO.txt \
            --commit "${GITHUB_SHA}" \
            --keystore-source "${HKETA_CUSTOM_KEY:-}"
          cat VERSION_INFO.txt

      # 對應版本嘅 Release 說明：v1.0.0 自動用 RELEASE_NOTES_v1.0.0.md；
      # 出新版未有專屬 notes 時退回簡短說明，唔會誤用其它版本嘅說明。
      - name: Compose release body for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f "RELEASE_NOTES_${TAG}.md" ]; then
            cp "RELEASE_NOTES_${TAG}.md" RELEASE_BODY.md
            echo "Using version-matched notes: RELEASE_NOTES_${TAG}.md"
          else
            {
              echo "# HK ETA ${TAG}"
              echo
              echo "正式版（signed release）APK 已附上，版本與 tag 對應。"
              echo "版本、versionCode、APK SHA-256 同簽章指紋見 \`VERSION_INFO.txt\` / \`SIGNING_FINGERPRINT.txt\`。"
              echo
              echo "安裝前請確認簽章一致；詳情見 repo 嘅雙語 README。"
            } > RELEASE_BODY.md
            echo "No RELEASE_NOTES_${TAG}.md; using the short version-matched body."
          fi

      - name: Upload signed release APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: hketa-release-apk
          path: hketa-${{ github.ref_name }}-release.apk
          if-no-files-found: error

      # 只附一個 .apk（正式版），其餘兩個係文字清單。
      # tag_name / name 顯式對應版本；prerelease 由 tag 有無 "-" 後綴決定。
      - name: Attach signed release APK to the matching version Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HK ETA ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            hketa-${{ github.ref_name }}-release.apk
            VERSION_INFO.txt
            SIGNING_FINGERPRINT.txt

  # =====================================================================
  # PUBLISHED_RELEASE_BACKFILL
  # ---------------------------------------------------------------------
  # A Release published BEFORE this workflow existed may still have no APK,
  # or only a debug APK. The in-app updater takes the FIRST .apk asset of
  # the latest Release, so this job rebuilds the SIGNED PRODUCTION APK from
  # THAT TAG'S OWN SOURCE, removes conflicting .apk assets and uploads
  # exactly one `hketa-<tag>-release.apk`.
  #
  # Deliberately does NOT create a Release, move the tag, bump a version or
  # rewrite the Release body (the bilingual v1.0.0 notes stay untouched).
  # =====================================================================
  backfill-published-release:
    name: Add signed production APK to an ALREADY-PUBLISHED Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # One checkout of the DEFAULT BRANCH gives us (a) the newest CI scripts
      # and (b) full tag history. The tag source is materialised with a git
      # worktree below, so Gradle never builds main's newer code as v1.0.0.
      - name: Checkout default branch (CI tools + full tag history)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve the already-published Release (PUBLISHED_RELEASE_BACKFILL)
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          python3 scripts/published_release.py resolve \
            --json releases.json \
            --requested "${{ inputs.tag }}" \
            --include-prerelease "${{ inputs.include_prerelease }}" \
            --out "$GITHUB_OUTPUT"
          echo "### 已發佈版本正式版補上" >> "$GITHUB_STEP_SUMMARY"
          echo "- 目標 Release：\`${{ steps.target.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Materialise the PUBLISHED tag source (not main)
        id: src
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          git fetch origin tag "$TAG" --force
          SRC="$RUNNER_TEMP/hketa-tag-src"
          git worktree add --detach "$SRC" "$TAG"
          # Newest CI scripts come from the default branch; the app source,
          # gradle files and resources stay EXACTLY as published at that tag.
          mkdir -p "$SRC/scripts"
          cp -r scripts/. "$SRC/scripts/"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cd "$SRC"
          echo "Tag source HEAD: $(git rev-parse HEAD)"
          grep -E 'versionName|versionCode' app/build.gradle.kts | head -4

      - name: JDK 17 (backfill)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK (backfill)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for c in /usr/local/lib/android/sdk /usr/lib/android-sdk "$HOME/Android/Sdk"; do
              [ -d "$c" ] && SDK="$c" && break
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::搵唔到 Android SDK（backfill）"
            exit 1
          fi
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                     "$SDK/cmdline-tools/bin/sdkmanager" \
                     "$SDK/tools/bin/sdkmanager"; do
              [ -x "$c" ] && SDKMANAGER="$c" && break
            done
          fi
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "::error::搵唔到 sdkmanager（backfill）"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept licenses and install SDK 34 (backfill)
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Decode release keystore (backfill)
        env:
          HKETA_KEYSTORE_BASE64: ${{ secrets.HKETA_KEYSTORE_BASE64 }}
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          HKETA_KEY_PASSWORD: ${{ secrets.HKETA_KEY_PASSWORD }}
        run: |
          SRC="${{ steps.src.outputs.src }}"
          cd "$SRC"
          if [ -n "$HKETA_KEYSTORE_BASE64" ]; then
            echo "$HKETA_KEYSTORE_BASE64" | base64 -d > app/hketa-release.keystore
            echo "HKETA_KEYSTORE_PASSWORD=$HKETA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "HKETA_KEY_ALIAS=${HKETA_KEY_ALIAS:-hketa}" >> "$GITHUB_ENV"
            echo "HKETA_KEY_PASSWORD=$HKETA_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "HKETA_CUSTOM_KEY=true" >> "$GITHUB_ENV"
            echo "Using injected production keystore."
          else
            echo "No HKETA_KEYSTORE_BASE64 secret: falling back to the committed dev key (identical certificate)."
          fi

      - name: Pin expected signing fingerprint (backfill)
        env:
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
        run: |
          SRC="${{ steps.src.outputs.src }}"
          cd "$SRC"
          if [ -f app/hketa-release.keystore ]; then
            KS=app/hketa-release.keystore
            PASS="${HKETA_KEYSTORE_PASSWORD:-hketa-dev-2026}"
            ALIAS="${HKETA_KEY_ALIAS:-hketa}"
          else
            KS=app/hketa-debug.keystore
            PASS=hketa-dev-2026
            ALIAS=hketa
          fi
          FP=$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" 2>/dev/null \
               | grep -m1 'SHA256:' | cut -d: -f2- | tr -d ' ')
          if grep -q 'expected_signing_sha256' app/src/main/res/values/strings.xml; then
            python3 scripts/pin_signing_fingerprint.py "$FP"
          else
            echo "::warning::呢個已發佈 tag 嘅 strings.xml 未有 expected_signing_sha256；跳過 pin，下面只用 apksigner 實際憑證核對"
          fi

      - name: Gradle 8.7 (backfill)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle-8.7-bin.zip" \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.7-bin.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Assemble signed release APK (backfill)
        run: |
          set -o pipefail
          SRC="${{ steps.src.outputs.src }}"
          cd "$SRC"
          ok=0
          for attempt in 1 2 3; do
            echo "::group::gradle assembleRelease (backfill attempt $attempt/3)"
            : > build-release.log
            if gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build-release.log; then
              echo "::endgroup::"
              ok=1
              break
            fi
            echo "::endgroup::"
            if grep -qE '429|Too Many Requests|Could not GET|Could not resolve|Read timed out|Connection reset|Received status code 5[0-9][0-9]' build-release.log; then
              if [ "$attempt" -lt 3 ]; then
                delay=$((attempt * 30))
                echo "::warning::Maven Central 429 / 5xx（backfill），${delay}s 後重試"
                sleep "$delay"
                continue
              fi
              echo "::error::連續 3 次依賴下載限流（backfill）；等幾分鐘再 Run workflow，唔使改任何檔"
            else
              echo "::error::Gradle 失敗唔係依賴下載問題，唔重試，交畀下一個 step 顯示真正錯誤"
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi

      - name: Show real Gradle error (backfill)
        if: failure()
        run: |
          SRC="${{ steps.src.outputs.src }}"
          cd "$SRC"
          python3 scripts/show_build_error.py build-release.log || true

      - name: Verify APK signing certificate (backfill)
        run: |
          set -euo pipefail
          SRC="${{ steps.src.outputs.src }}"
          cd "$SRC"
          TAG="${{ steps.target.outputs.tag }}"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --print-certs "$APK" | tee apksigner-output.txt
          APK_FP=$(grep -m1 'SHA-256 digest' apksigner-output.txt \
                   | cut -d: -f2- | tr -d ' ' | tr 'a-f' 'A-F')
          PIN=$(python3 -c "import re,sys;m=re.search(r'<string name="expected_signing_sha256">([^<]*)</string>',open('app/src/main/res/values/strings.xml',encoding='utf-8').read());print(m.group(1) if m else '')")
          echo "APK certificate : $APK_FP"
          echo "Pinned value    : ${PIN:-(tag 版本無 pin 資源)}"
          if [ -n "$PIN" ] && [ "$APK_FP" != "$PIN" ]; then
            echo "::error::APK 簽章憑證同 pinned 指唔夾（backfill）"
            exit 1
          fi
          {
            echo "HK ETA APK signing certificate (published-release backfill)"
            echo "Tag: $TAG"
            echo "SHA-256: $APK_FP"
          } > SIGNING_FINGERPRINT.txt
          cp "$APK" "hketa-$TAG-release.apk"
          echo "### Backfill 簽章 SHA-256: \`$APK_FP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Dump release APK badging (backfill)
        run: |
          SRC="${{ steps.src.outputs.src }}"
          cd "$SRC"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDK/build-tools/34.0.0/aapt"
          if [ ! -x "$AAPT" ]; then
            echo "::error::搵唔到 aapt（backfill）"
            exit 1
          fi
          "$AAPT" dump badging \
            "app/build/outputs/apk/release/app-release.apk" > apk-badging.txt
          head -1 apk-badging.txt

      # SAME version gate as a fresh tag: tag == tag's build.gradle.kts ==
      # the ACTUAL APK badging. Using main's newer source would FAIL here,
      # which is exactly what keeps a published version honest.
      - name: Verify release version matches the PUBLISHED tag (backfill)
        run: |
          set -euo pipefail
          SRC="${{ steps.src.outputs.src }}"
          cd "$SRC"
          TAG="${{ steps.target.outputs.tag }}"
          COMMIT="$(git rev-parse HEAD)"
          python3 scripts/verify_release_version.py \
            --tag "$TAG" \
            --gradle app/build.gradle.kts \
            --badging apk-badging.txt \
            --apk "hketa-$TAG-release.apk" \
            --signing apksigner-output.txt \
            --out VERSION_INFO.txt \
            --commit "$COMMIT" \
            --keystore-source "${HKETA_CUSTOM_KEY:-}"
          cat VERSION_INFO.txt

      - name: Prune conflicting .apk assets (PUBLISHED_RELEASE_BACKFILL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC="${{ steps.src.outputs.src }}"
          cd "$SRC"
          TAG="${{ steps.target.outputs.tag }}"
          APK_NAME="hketa-$TAG-release.apk"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" > release-before.json
          python3 scripts/published_release.py prune \
            --json release-before.json --keep "$APK_NAME" --out prune-ids.txt
          while read -r ID; do
            [ -z "$ID" ] && continue
            echo "Removing old .apk asset id $ID"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$ID"
          done < prune-ids.txt
          echo "[OK] 非 .apk assets 同 Release body 完全保留"

      - name: Upload signed production APK to the ALREADY-PUBLISHED Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC="${{ steps.src.outputs.src }}"
          cd "$SRC"
          TAG="${{ steps.target.outputs.tag }}"
          APK_NAME="hketa-$TAG-release.apk"
          # --clobber replaces a same-named asset; the Release itself, its
          # tag, its published_at and its bilingual body are NOT touched.
          gh release upload "$TAG" \
            "$APK_NAME" VERSION_INFO.txt SIGNING_FINGERPRINT.txt --clobber
          echo "::notice::已喺已發佈版本 $TAG 加入正式版 $APK_NAME（冇新建 Release、冇改 tag、冇改內文）"

      - name: Verify final Release has exactly ONE production APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          APK_NAME="hketa-$TAG-release.apk"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" > release-after.json
          python3 scripts/published_release.py final \
            --json release-after.json --expect "$APK_NAME"
          echo "### 已發佈版本 \`$TAG\` 正式版 ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Asset：\`$APK_NAME\`（唯一 .apk）" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release 內文／tag／published_at 不變" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backfill artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hketa-backfill-${{ steps.target.outputs.tag }}-release-apk
          path: |
            ${{ steps.src.outputs.src }}/hketa-${{ steps.target.outputs.tag }}-release.apk
            ${{ steps.src.outputs.src }}/VERSION_INFO.txt
            ${{ steps.src.outputs.src }}/SIGNING_FINGERPRINT.txt
          if-no-files-found: error

