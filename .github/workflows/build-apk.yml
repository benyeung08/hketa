name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 手動觸發

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify gradlew exists
        working-directory: androidApp
        run: |
          ls -la gradlew
          ls -la gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Grant execute permission for gradlew
        working-directory: androidApp
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: androidApp
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: androidApp
        run: ./gradlew assembleRelease --no-daemon --stacktrace || echo "::warning::Release build skipped (no signing keystore configured)"

      - name: List build outputs
        working-directory: androidApp
        run: |
          echo "=== Debug APKs ==="
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK"
          echo "=== Release APKs ==="
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || echo "No release APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hketa-debug-apk
          path: androidApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hketa-release-apk
          path: androidApp/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: hketa-debug-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HK ETA Build #${{ github.run_number }}
          body: |
            ## HK ETA 自動建置

            由 GitHub Actions 自動產生的 APK 檔案。

            ### 下載
            - `app-debug.apk` — 可直接安裝測試

            ### 建置資訊
            - 提交：`${{ github.sha }}`
            - 訊息：${{ github.event.head_commit.message }}

            ### 安裝方式
            下載 APK 後，在手機上開啟檔案即可安裝（需允許「未知來源」安裝權限）。
          files: |
            *.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
