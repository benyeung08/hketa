name: Build HKETA Release APK

# 只出正式版（release）APK —— 一份，簽名固定。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35 components
        run: |
          set -x
          ls "$ANDROID_HOME" || true
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "::error::platforms;android-35 not found, cannot compileSdk 35"
            exit 1
          fi

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo chmod +x /opt/gradle-8.9/bin/gradle
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          java -version
          gradle --version | head -12

      # 固定簽名：GitHub runner 每次都係全新機器，若然用系統自動產生嘅 debug key，
      # 每次簽名都唔同，用戶裝新版會彈「套件與現有的套件發生衝突」。
      # 呢度確保 keystore/hketa.jks 存在（冇就由 base64 文字檔還原）。
      - name: Ensure signing keystore
        run: |
          mkdir -p keystore
          if [ -s keystore/hketa.jks ]; then
            echo "keystore/hketa.jks already present"
          elif [ -s keystore/hketa.jks.b64 ]; then
            base64 -d keystore/hketa.jks.b64 > keystore/hketa.jks
            echo "restored from hketa.jks.b64"
          else
            echo "::warning::no fixed keystore found - APK signature will differ between builds"
          fi
          if [ -s keystore/hketa.jks ]; then
            keytool -list -keystore keystore/hketa.jks -storepass hketa2026 -alias hketa > /dev/null 2>&1 \
              && echo "keystore verified" \
              || { echo "::error::keystore is invalid"; exit 1; }
          fi

      # 一定要 set -o pipefail：淨係寫 `gradle ... | tee log` 嘅話，
      # 管道退出碼係 tee（永遠 0），gradle 失敗會被吞掉、步驟顯示綠剔。
      - name: Build Release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/release-build.log

      - name: Show build outputs
        run: |
          echo "--- app/build/outputs ---"
          find app/build/outputs -maxdepth 4 2>/dev/null || echo "(none)"
          echo "--- all apk ---"
          find app/build -name "*.apk" 2>/dev/null || true

      - name: Collect release APK
        run: |
          mkdir -p apk-out
          for f in $(find app/build/outputs/apk -name "*.apk" -type f); do
            cp "$f" "apk-out/HKETA-release.apk"
          done
          ls -lh apk-out
          test -n "$(ls -A apk-out)" || { echo "::error::no APK produced"; exit 1; }

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hketa-release-apk
          path: apk-out/*.apk

      - name: Attach APK to release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write errors to job summary
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo
            echo "### Error excerpt"
            echo '```'
            grep -h -E "^(e: |error: |FAILURE: |.*What went wrong)" -A 4 /tmp/*-build.log 2>/dev/null | head -80 || echo "(no error lines captured)"
            echo '```'
            echo
            echo "Full log: download the **build-log** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/*-build.log
          if-no-files-found: ignore
