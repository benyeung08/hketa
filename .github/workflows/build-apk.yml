name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Detect and Install API 37/36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "=== Available platforms ==="
          sdkmanager --list 2>/dev/null | grep "platforms;android-3[6-9]\|platforms;android-4" || true

          # Try API 37 first, fallback to API 36
          API_VER=""
          for ver in 37 36; do
            echo "=== Trying API $ver ==="
            if sdkmanager "platform-tools" "platforms;android-$ver" "build-tools;$ver.0.0" 2>&1 | grep -q "done"; then
              API_VER=$ver
              echo "✅ API $ver installed successfully"
              break
            else
              echo "⚠️ API $ver not available, trying next..."
            fi
          done

          if [ -z "$API_VER" ]; then
            echo "❌ Neither API 37 nor API 36 available"
            echo "=== Fallback: list all available platforms ==="
            sdkmanager --list 2>/dev/null | grep "^  platforms;android" || true
            # Find highest available
            HIGHEST=$(sdkmanager --list 2>/dev/null | grep -oP "platforms;android-\K[0-9]+" | sort -n | tail -1)
            echo "Highest available: $HIGHEST"
            API_VER=$HIGHEST
            sdkmanager "platform-tools" "platforms;android-$API_VER" "build-tools;$API_VER.0.0" || {
              echo "FATAL: Cannot install any Android platform SDK"
              exit 1
            }
          fi

          echo "=== Final API_VER=$API_VER ==="
          echo "API_VER=$API_VER" >> $GITHUB_ENV
          echo "$API_VER" > /tmp/api_ver.txt

          echo "=== Installed platforms ==="
          ls $ANDROID_HOME/platforms/ 2>/dev/null || true
          echo "=== Installed build-tools ==="
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || true

      - name: Update build.gradle.kts API levels
        run: |
          cd androidApp
          API_VER=$(cat /tmp/api_ver.txt)
          echo "Setting compileSdk/targetSdk to $API_VER"

          # Update compileSdk and targetSdk to detected API level
          sed -i "s/compileSdk = [0-9]*/compileSdk = $API_VER/" build.gradle.kts
          sed -i "s/targetSdk = [0-9]*/targetSdk = $API_VER/" build.gradle.kts

          echo "=== Updated build.gradle.kts ==="
          grep -n "compileSdk\|targetSdk" build.gradle.kts

      - name: Create local.properties
        run: |
          cd androidApp
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "✅ local.properties created:"
          cat local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.2"
          cache-disabled: false

      - name: Build APK
        run: |
          cd androidApp
          API_VER=$(cat /tmp/api_ver.txt)
          echo "Building with COMPILE_SDK_VERSION=$API_VER"
          gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          COMPILE_SDK_VERSION: ${{ env.API_VER }}

      - name: Verify APK
        run: |
          cd androidApp
          APK_PATH="build/outputs/apk/debug/androidApp-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ Found APK: $APK_PATH"
            ls -la "$APK_PATH"
          else
            echo "APK not at expected path, searching..."
            find . -name "*.apk" -type f
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hketa-app-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HK ETA App v${{ github.run_number }} (API ${{ env.API_VER }})
          files: androidApp/build/outputs/apk/debug/*.apk
          body: |
            Automated build #${{ github.run_number }}
            Target API: ${{ env.API_VER }}
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
