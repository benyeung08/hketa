name: Build HKETA APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # 支援範圍 Android 8 (API 26) – 17 (API 37)，所以 compile 用 android-37。
      # AGP 9.1.1 預設 build-tools 為 36.0.0；平台在不同 channel 可能叫
      # android-37 或 android-37.0，兩者都試，再用 --list 動態兜底。
      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0" > /dev/null
          sdkmanager --list > "$RUNNER_TEMP/sdk-list.txt" || true
          if ! sdkmanager "platforms;android-37" > /dev/null 2>&1; then
            if ! sdkmanager "platforms;android-37.0" > /dev/null 2>&1; then
              P=$(grep -oE 'platforms;android-37(\.[0-9]+)?' "$RUNNER_TEMP/sdk-list.txt" | head -1 || true)
              echo "Falling back to SDK package: $P"
              sdkmanager "$P" > /dev/null
            fi
          fi
          echo "Installed platforms:"
          ls -1 "$ANDROID_HOME/platforms"

      - name: Point Gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 不把 gradle-wrapper.jar（二進位檔）放進 repo，改為在 runner 上裝 Gradle 9.3.1。
      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle-dist"
          chmod +x "$RUNNER_TEMP/gradle-dist/gradle-9.3.1/bin/gradle"
          echo "$RUNNER_TEMP/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      # ── 永久簽名：所有產出共用同一把 key ──────────────────────────
      # keystore 本體以 base64 存在 GitHub Secret，永遠唔入 repo。
      - name: Verify signing secrets
        env:
          KS_B64: ${{ secrets.HKETA_KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.HKETA_KEY_PASSWORD }}
        run: |
          MISSING=""
          if [ -z "$KS_B64" ];   then MISSING="$MISSING HKETA_KEYSTORE_BASE64"; fi
          if [ -z "$KS_PWD" ];   then MISSING="$MISSING HKETA_KEYSTORE_PASSWORD"; fi
          if [ -z "$KS_ALIAS" ]; then MISSING="$MISSING HKETA_KEY_ALIAS"; fi
          if [ -z "$KEY_PWD" ];  then MISSING="$MISSING HKETA_KEY_PASSWORD"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secrets:$MISSING"
            echo "請依 README「永久簽名一致性」建立 keystore 並填入 4 個 Repository Secrets。"
            exit 1
          fi

      - name: Restore permanent signing key
        env:
          KS_B64: ${{ secrets.HKETA_KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/hketa.jks"
          chmod 600 "$RUNNER_TEMP/hketa.jks"
          CERT=$(keytool -list -v -keystore "$RUNNER_TEMP/hketa.jks" \
                   -storepass "$KS_PWD" -alias "$KS_ALIAS" 2>/dev/null \
                 | grep -m1 'SHA256:' | sed 's/.*SHA256: //' \
                 | tr -d ':' | tr 'A-Z' 'a-z' | tr -d '[:space:]' || true)
          if [ -z "$CERT" ]; then
            echo "::error::Cannot derive certificate SHA-256 from keystore (check alias / passwords)"
            exit 1
          fi
          echo "HKETA_KEYSTORE_FILE=$RUNNER_TEMP/hketa.jks" >> "$GITHUB_ENV"
          echo "HKETA_SIGNING_CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          echo "Permanent signing cert SHA-256: \`$CERT\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate hketa.json
        run: python3 -m json.tool app/src/main/assets/hketa.json > /dev/null

      # 檢查四類路線資料、收費／服務班次覆蓋、XML/R.id、簽名與更新設定一致性
      - name: Validate project consistency
        run: python3 scripts/validate.py

      - name: Assemble debug APK
        env:
          HKETA_KEYSTORE_FILE: ${{ runner.temp }}/hketa.jks
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          HKETA_KEY_PASSWORD: ${{ secrets.HKETA_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Copy debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HKETA-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HKETA-debug
          path: HKETA-debug.apk
          if-no-files-found: error

      - name: Assemble release APK
        env:
          HKETA_KEYSTORE_FILE: ${{ runner.temp }}/hketa.jks
          HKETA_KEYSTORE_PASSWORD: ${{ secrets.HKETA_KEYSTORE_PASSWORD }}
          HKETA_KEY_ALIAS: ${{ secrets.HKETA_KEY_ALIAS }}
          HKETA_KEY_PASSWORD: ${{ secrets.HKETA_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      # 固定檔名方便「設定 → 檢查更新」由 Release assets 認出 APK
      - name: Copy release APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" HKETA-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HKETA-release
          path: HKETA-release.apk
          if-no-files-found: error

      # 用 apksigner 反讀兩個 APK 嘅憑證指紋，同 keystore 抽出嘅值比對，
      # 確認唔論 debug / release 都係同一把永久 key。
      - name: Verify signature consistency
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for APK in HKETA-debug.apk HKETA-release.apk; do
            FP=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
                 | grep -m1 'SHA-256 digest' | sed 's/.*: //' \
                 | tr -d ':' | tr 'A-Z' 'a-z' | tr -d '[:space:]' || true)
            echo "$APK -> $FP"
            if [ "$FP" != "$HKETA_SIGNING_CERT_SHA256" ]; then
              echo "::error::Signature mismatch on $APK (expected $HKETA_SIGNING_CERT_SHA256)"
              exit 1
            fi
          done
          echo "✅ debug + release 均使用同一永久憑證：\`$HKETA_SIGNING_CERT_SHA256\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HKETA-release.apk
          body: |
            由 GitHub Actions 自動建置的 HKETA Kotlin 版 APK。
            此 `.apk` 供 App 內「設定 → 檢查更新」直接使用。
            支援 Android 8.0 (API 26) – Android 17 (API 37)。
            所有版本共用同一把永久簽名金鑰，可直接覆蓋升級。
            簽名憑證 SHA-256：${{ env.HKETA_SIGNING_CERT_SHA256 }}
            內建 assets/hketa.json 為示範資料，並非即時到站時間。
